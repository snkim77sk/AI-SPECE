name: gpt-site-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpt-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gpt-site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install openpyxl==3.1.5
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
