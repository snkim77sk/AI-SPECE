name: import-smoke

on:
  push:
    branches:
      - main
      - work/2.2.1-shop-history-upload
  workflow_dispatch:

jobs:
  import-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify 2.2 file layout only
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -name 'sinsung_v221_*.py' -print -quit)"
          test -z "$(find . -maxdepth 1 -name 'sinsung_v230_*.py' -print -quit)"
          echo EXISTING_MODULE_LAYOUT_OK

      - name: Import main
        env:
          G2B_DB_PATH: /tmp/g2b-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: python -c "import main; print('IMPORT_OK', main.app)"

      - name: Test-mode uvicorn health
        env:
          G2B_DB_PATH: /tmp/g2b-smoke-server.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-test.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-test.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health-test.json; then
              cat /tmp/health-test.json
              python -c "import json; d=json.load(open('/tmp/health-test.json', encoding='utf-8')); assert d.get('version') == '2.2.1', d"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Production-like health and scheduler
        env:
          G2B_DB_PATH: /tmp/g2b-prod-server.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn-prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-prod.log; kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/health > /tmp/health-prod.json; then
              if python -c "import json; d=json.load(open('/tmp/health-prod.json', encoding='utf-8')); assert d.get('status') == 'ok', d; assert d.get('version') == '2.2.1', d; assert d.get('backend_ok') is True, d"; then
                ready=1
                cat /tmp/health-prod.json
                break
              fi
            fi
            sleep 0.5
          done
          test "$ready" = 1
          G2B_DB_PATH=/tmp/g2b-prod-server.sqlite3 python - <<'PY'
          from db import get_setting
          assert get_setting('auto_sync_enabled') == '1'
          assert get_setting('auto_sync_hours') == '2'
          assert get_setting('auto_sync_days') == '14'
          assert get_setting('auto_sync_api_reserve') == '100'
          assert get_setting('backfill_status') == '비활성'
          assert get_setting('scheduler_heartbeat')
          print('AUTO_STABILITY_221_OK')
          PY

      - name: Shopping history CSV XLSX and UPSERT
        env:
          G2B_DB_PATH: /tmp/g2b-upload.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: |
          python - <<'PY'
          import io
          import zipfile

          import main
          from db import connect
          from sinsung_v220_app import _parse_shop_history_file, _process_shop_history_upload

          csv_bytes = (
              "납품요구일자,수요기관명,계약업체명,세부품명번호,세부품명,물품식별번호,제품명,단가,수량,납품요구번호,순번\n"
              "2025-02-01,서울시,A조명,3911160302,LED가로등기구,12345678,TEST-A,1000,2,REQ-1,1\n"
              "2026-08-01,서울시,A조명,3911160302,LED가로등기구,12345679,OUTSIDE,1000,1,REQ-2,1\n"
              "2025-03-01,서울시,A조명,9999999999,기타,12345680,NONTARGET,1000,1,REQ-3,1\n"
          ).encode("utf-8-sig")

          result1 = _process_shop_history_upload("history.csv", csv_bytes)
          assert "저장·갱신 1건" in result1, result1
          result2 = _process_shop_history_upload("history.csv", csv_bytes)
          assert "저장·갱신 1건" in result2, result2

          with connect() as conn:
              shopping = conn.execute("SELECT COUNT(*) FROM shopping_contracts WHERE is_sample=0").fetchone()[0]
              bids = conn.execute("SELECT COUNT(*) FROM bids WHERE is_sample=0").fetchone()[0]
          assert shopping == 1, shopping
          assert bids == 0, bids

          sheet = '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>
            <row r="1">
              <c r="A1" t="inlineStr"><is><t>납품요구일자</t></is></c>
              <c r="B1" t="inlineStr"><is><t>세부품명번호</t></is></c>
              <c r="C1" t="inlineStr"><is><t>물품식별번호</t></is></c>
            </row>
            <row r="2">
              <c r="A2" t="inlineStr"><is><t>2025-04-01</t></is></c>
              <c r="B2" t="inlineStr"><is><t>3911160302</t></is></c>
              <c r="C2" t="inlineStr"><is><t>22345678</t></is></c>
            </row>
          </sheetData></worksheet>'''
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w") as z:
              z.writestr("xl/worksheets/sheet1.xml", sheet)
          rows = _parse_shop_history_file("history.xlsx", buf.getvalue())
          assert len(rows) == 1
          assert rows[0]["dlvrReqRcptDate"] == "2025-04-01"
          assert rows[0]["dtilPrdctClsfcNo"] == "3911160302"
          assert rows[0]["prdctIdntNo"] == "22345678"
          print('SHOP_HISTORY_UPLOAD_221_OK')
          PY
