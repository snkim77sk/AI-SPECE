name: import-smoke

on:
  push:
    branches:
      - main
      - work/2.2.2-login-hardening
  workflow_dispatch:

jobs:
  import-main:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import main
        env:
          G2B_DB_PATH: /tmp/g2b-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: python -c "import main; print('IMPORT_OK', main.app)"

      - name: Production health and unchanged scheduler
        env:
          G2B_DB_PATH: /tmp/g2b-prod.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8001 >/tmp/prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/prod.log; kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/health >/tmp/health.json; then
              if python -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('version')=='2.2.2'; assert d.get('backend_ok') is True"; then ready=1; break; fi
            fi
            sleep .5
          done
          test "$ready" = 1
          G2B_DB_PATH=/tmp/g2b-prod.sqlite3 G2B_AUTO_SYNC=1 python - <<'PY'
          from db import get_setting
          assert get_setting('auto_sync_enabled') == '1'
          assert get_setting('auto_sync_hours') == '2'
          assert get_setting('auto_sync_days') == '14'
          assert get_setting('auto_sync_api_reserve') == '100'
          assert get_setting('backfill_status') == '비활성'
          assert get_setting('scheduler_heartbeat')
          print('SCHEDULER_22_UNCHANGED_OK')
          PY

      - name: Login hardening full HTTP flow
        env:
          G2B_DB_PATH: /tmp/g2b-auth.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
          G2B_COOKIE_SECURE: '0'
          DASHBOARD_SECRET: 'ci-login-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ'
        run: |
          set -euo pipefail
          python - <<'PY'
          from db import init_db, connect
          import server
          init_db()
          with connect() as conn:
              conn.execute('DELETE FROM users')
              conn.execute("INSERT INTO users(username,password_hash,role,status) VALUES (?,?, 'admin','active')", ('admin1', server._password_hash('OldPassword123!')))
          PY
          uvicorn main:app --host 0.0.0.0 --port 8003 >/tmp/auth.log 2>&1 &
          pid=$!
          trap 'cat /tmp/auth.log; kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8003/health >/tmp/auth-health.json; then
              if python -c "import json; d=json.load(open('/tmp/auth-health.json')); assert d.get('backend_ok') is True"; then ready=1; break; fi
            fi
            sleep .5
          done
          test "$ready" = 1

          curl -fsS http://127.0.0.1:8003/login -o /tmp/login.html
          python - <<'PY'
          import re
          t=open('/tmp/login.html',encoding='utf-8').read(); m=re.search(r'name="_csrf" value="([^"]+)"',t); assert m
          open('/tmp/csrf','w').write(m.group(1))
          PY
          csrf=$(cat /tmp/csrf)
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8003/login --data-urlencode 'username=admin1' --data-urlencode 'password=OldPassword123!')" = 403
          test "$(curl -sS -D /tmp/login.headers -o /dev/null -c /tmp/session.jar -w '%{http_code}' -X POST http://127.0.0.1:8003/login --data-urlencode "_csrf=$csrf" --data-urlencode 'username=admin1' --data-urlencode 'password=OldPassword123!')" = 302
          grep -qi 'SameSite=Strict' /tmp/login.headers
          cp /tmp/session.jar /tmp/old.jar
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/session.jar http://127.0.0.1:8003/dashboard)" = 200

          curl -fsS -b /tmp/session.jar http://127.0.0.1:8003/account -o /tmp/account.html
          python - <<'PY'
          import re
          t=open('/tmp/account.html',encoding='utf-8').read(); assert '비밀번호 변경' in t
          m=re.search(r'name="_csrf" value="([^"]+)"',t); assert m
          open('/tmp/acsrf','w').write(m.group(1))
          PY
          acsrf=$(cat /tmp/acsrf)
          test "$(curl -sS -o /dev/null -b /tmp/session.jar -c /tmp/session.jar -w '%{http_code}' -X POST http://127.0.0.1:8003/account --data-urlencode "_csrf=$acsrf" --data-urlencode 'current_password=OldPassword123!' --data-urlencode 'new_password=NewPassword456!' --data-urlencode 'new_password_confirm=NewPassword456!')" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/old.jar http://127.0.0.1:8003/dashboard)" = 302
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/session.jar http://127.0.0.1:8003/dashboard)" = 200
          test "$(curl -sS -D /tmp/logout.headers -o /dev/null -b /tmp/session.jar -c /tmp/session.jar -w '%{http_code}' http://127.0.0.1:8003/logout)" = 302
          grep -qi 'Max-Age=0' /tmp/logout.headers
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/session.jar http://127.0.0.1:8003/dashboard)" = 302
          echo LOGIN_HARDENING_222_OK

      - name: Collector files unchanged from release 2.2
        run: |
          test "$(git hash-object collector_v200.py)" = "d7e2f9edd6ed68558993ef8a0fd05b539647255d"
          test "$(git hash-object scheduler.py)" = "4f88e7d9062b1015f76996c11bb7d6c92baa12e7"
          echo COLLECTOR_FILES_UNCHANGED_OK
