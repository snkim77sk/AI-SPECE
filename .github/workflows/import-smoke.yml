name: import-smoke

on:
  push:
    branches:
      - main
      - work/2.0-clean-data-engine
      - work/2.1-auto-sync
      - work/2.2-auto-stability
      - work/2.3-inplace-from-2.2
  workflow_dispatch:

jobs:
  import-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify no new v230 Python modules
        run: |
          set -euo pipefail
          test -z "$(find . -maxdepth 1 -name 'sinsung_v230_*.py' -print -quit)"
          echo NO_NEW_V230_MODULES_OK

      - name: Import main
        env:
          G2B_DB_PATH: /tmp/g2b-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: python -c "import main; print('IMPORT_OK', main.app)"

      - name: Test-mode uvicorn health
        env:
          G2B_DB_PATH: /tmp/g2b-smoke-server.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-test.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-test.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health-test.json; then
              cat /tmp/health-test.json
              python -c "import json; d=json.load(open('/tmp/health-test.json', encoding='utf-8')); assert d.get('version') == '2.3', d"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Production-like health and 2.3 in-place defaults
        env:
          G2B_DB_PATH: /tmp/g2b-prod-server.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn-prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-prod.log; kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/health > /tmp/health-prod.json; then
              if python -c "import json; d=json.load(open('/tmp/health-prod.json', encoding='utf-8')); assert d.get('status') == 'ok', d; assert d.get('configured') is True, d; assert d.get('version') == '2.3', d; assert d.get('backend_ok') is True, d"; then
                ready=1
                cat /tmp/health-prod.json
                break
              fi
            fi
            sleep 0.5
          done
          test "$ready" = 1
          G2B_DB_PATH=/tmp/g2b-prod-server.sqlite3 python - <<'PY'
          from db import get_setting
          assert get_setting('auto_sync_enabled') == '1'
          assert get_setting('auto_sync_hours') == '2'
          assert get_setting('auto_sync_days') == '14'
          assert get_setting('auto_sync_api_reserve') == '100'
          assert get_setting('backfill_api_reserve') == '200'
          assert get_setting('backfill_status') == '대기'
          assert get_setting('v230_history_inplace_initialized') == '1'
          assert get_setting('scheduler_heartbeat')
          print('INPLACE_23_DEFAULTS_OK')
          PY

      - name: Restart recovery using existing 2.2 modules
        env:
          G2B_DB_PATH: /tmp/g2b-restart.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from db import init_db, set_setting
          init_db()
          set_setting('v200_clean_data_reset_completed','1')
          set_setting('v210_auto_sync_initialized','1')
          set_setting('v220_auto_stability_initialized','1')
          set_setting('v230_history_inplace_initialized','1')
          set_setting('last_auto_sync_status','수집중')
          set_setting('last_auto_sync_started','2026-08-15T00:00:00')
          set_setting('manual_sync_active','1')
          set_setting('backfill_status','실행중')
          set_setting('backfill_auto_resume','1')
          set_setting('backfill_cursor_date','2025-03-01')
          set_setting('backfill_cursor_source','bids')
          PY
          uvicorn main:app --host 0.0.0.0 --port 8002 > /tmp/uvicorn-restart.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-restart.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null; then
              if G2B_DB_PATH=/tmp/g2b-restart.sqlite3 python - <<'PY'
          from db import get_setting
          assert get_setting('last_auto_sync_status') == '재시작복구'
          assert get_setting('manual_sync_active') == '0'
          assert get_setting('backfill_status') == '재개대기'
          assert get_setting('backfill_cursor_date') == '2025-03-01'
          assert get_setting('backfill_cursor_source') == 'bids'
          print('RESTART_CHECKPOINT_RECOVERY_OK')
          PY
              then exit 0; fi
            fi
            sleep 0.5
          done
          exit 1

      - name: History quota collision and checkpoint state
        env:
          G2B_DB_PATH: /tmp/g2b-history.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '0'
        run: |
          python - <<'PY'
          import datetime as dt
          import main
          import app
          import scheduler as s
          from db import get_setting, set_setting

          set_setting('api_key', 'TEST_KEY')
          set_setting('auto_sync_enabled', '0')
          set_setting('api_daily_limit', '900')
          set_setting('backfill_api_reserve', '200')
          today = dt.date.today().isoformat()
          set_setting('api_calls_shop_date', today)
          set_setting('api_calls_shop_count', '700')
          ok, used, limit, reserve = s._history_quota_ready('shop')
          assert ok is False and (used, limit, reserve) == (700, 900, 200)
          set_setting('api_calls_shop_count', '0')

          assert s.start_history_backfill() is True
          set_setting('backfill_target_end', '2025-01-01')
          set_setting('backfill_cursor_date', '2025-01-01')
          set_setting('backfill_cursor_source', 'shop')

          calls=[]
          def fake_shop(a,b): calls.append(('shop',a,b)); return 1
          def fake_bids(a,b): calls.append(('bids',a,b)); return 2
          def fake_services(a,b): calls.append(('services',a,b)); return 3
          s.sync_shopping_period=fake_shop
          s.sync_bids_period=fake_bids
          s.sync_services_period=fake_services

          assert s._run_history_step() is True
          assert s._run_history_step() is True
          assert s._run_history_step() is True
          assert [x[0] for x in calls] == ['shop','bids','services'], calls
          assert get_setting('backfill_status') == '완료'
          assert get_setting('backfill_progress') == '100'
          assert get_setting('backfill_saved_shop') == '1'
          assert get_setting('backfill_saved_bids') == '2'
          assert get_setting('backfill_saved_services') == '3'
          assert get_setting('api_daily_limit') == '900'

          set_setting('backfill_auto_resume','1')
          set_setting('backfill_status','준비')
          ok, msg = app._start_background_collect('sync-shop', b'', {})
          assert ok is False and '과거자료' in msg, (ok,msg)
          print('HISTORY_INPLACE_STATE_OK')
          PY
