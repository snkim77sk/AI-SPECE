name: import-smoke

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - work/2.0-clean-data-engine
      - work/2.1-auto-sync
      - work/2.2-auto-stability
  workflow_dispatch:

jobs:
  import-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import main
        env:
          G2B_DB_PATH: /tmp/g2b-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: python -c "import main; print('IMPORT_OK', main.app)"

      - name: Test-mode uvicorn health
        env:
          G2B_DB_PATH: /tmp/g2b-smoke-server.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-test.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-test.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health-test.json; then
              cat /tmp/health-test.json
              python -c "import json; d=json.load(open('/tmp/health-test.json', encoding='utf-8')); assert d.get('version') == '2.2', d"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn-test.log
          exit 1

      - name: Production-like health backend and 2.2 scheduler defaults
        env:
          G2B_DB_PATH: /tmp/g2b-prod-server.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn-prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-prod.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health > /tmp/health-prod.json; then
              if python -c "import json; d=json.load(open('/tmp/health-prod.json', encoding='utf-8')); assert d.get('status') == 'ok', d; assert d.get('configured') is True, d; assert d.get('version') == '2.2', d; assert d.get('backend_ok') is True, d"; then
                cat /tmp/health-prod.json
                break
              fi
            fi
            sleep 0.5
          done
          for i in $(seq 1 20); do
            if G2B_DB_PATH=/tmp/g2b-prod-server.sqlite3 python -c "from db import get_setting; assert get_setting('auto_sync_enabled') == '1'; assert get_setting('auto_sync_hours') == '2'; assert get_setting('auto_sync_days') == '14'; assert get_setting('auto_sync_api_reserve') == '100'; assert get_setting('manual_sync_active') == '0'; assert get_setting('backfill_status') == '비활성'; assert get_setting('v220_auto_stability_initialized') == '1'; assert get_setting('scheduler_heartbeat'); print('AUTO_STABILITY_22_OK')"; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/uvicorn-prod.log
          exit 1

      - name: Upgrade restart-state recovery
        env:
          G2B_DB_PATH: /tmp/g2b-restart.sqlite3
          G2B_AUTO_SYNC: '1'
        run: |
          set -euo pipefail
          python -c "from db import init_db,set_setting; init_db(); set_setting('v200_clean_data_reset_completed','1'); set_setting('v210_auto_sync_initialized','1'); set_setting('last_auto_sync_status','수집중'); set_setting('last_auto_sync_started','2026-08-15T00:00:00'); set_setting('manual_sync_active','1')"
          uvicorn main:app --host 0.0.0.0 --port 8002 > /tmp/uvicorn-restart.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-restart.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null; then
              if python -c "import os; os.environ['G2B_DB_PATH']='/tmp/g2b-restart.sqlite3'; from db import get_setting; assert get_setting('last_auto_sync_status') == '재시작복구'; assert get_setting('manual_sync_active') == '0'; print('RESTART_RECOVERY_OK')"; then
                exit 0
            fi
            fi
            sleep 0.5
          done
          cat /tmp/uvicorn-restart.log
          exit 1

      - name: Manual automatic collision quota and catchup guards
        env:
          G2B_DB_PATH: /tmp/g2b-collision.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '1'
        run: |
          python - <<'PY'
          import datetime as dt
          import main
          import app
          import scheduler
          from db import set_setting, get_setting

          set_setting('last_auto_sync_status', '수집중')
          ok, msg = app._start_background_collect('sync-shop', b'', {})
          assert ok is False and '자동수집' in msg, (ok, msg)

          set_setting('last_auto_sync_status', '대기')
          set_setting('last_auto_sync', '')
          set_setting('manual_sync_active', '1')
          set_setting('manual_sync_source', '쇼핑몰 조달내역')
          ran = scheduler._run_procurement_auto()
          assert ran is False
          assert get_setting('last_auto_sync_status') == '수동수집 대기'

          today = dt.date.today().isoformat()
          set_setting('api_daily_limit', '900')
          set_setting('auto_sync_api_reserve', '100')
          set_setting('api_calls_shop_date', today)
          set_setting('api_calls_shop_count', '800')
          qok, used, limit, reserve = scheduler._quota_ok('shop')
          assert qok is False and (used, limit, reserve) == (800, 900, 100)

          set_setting('last_auto_sync_success', (dt.datetime.now() - dt.timedelta(days=20)).isoformat(timespec='seconds'))
          days = scheduler._effective_days(dt.date.today())
          assert 22 <= days <= 30, days
          print('COLLISION_QUOTA_CATCHUP_GUARD_OK')
          PY
