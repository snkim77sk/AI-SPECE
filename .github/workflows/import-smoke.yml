name: import-smoke

on:
  push:
    branches:
      - main
      - work/2.0-clean-data-engine
  workflow_dispatch:

jobs:
  import-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import main
        env:
          G2B_DB_PATH: /tmp/g2b-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '0'
        run: python -c "import main; print('IMPORT_OK', main.app)"
      - name: Test-mode uvicorn health
        env:
          G2B_DB_PATH: /tmp/g2b-smoke-server.sqlite3
          G2B_TEST_MODE: '1'
          G2B_AUTO_SYNC: '0'
          PORT: '8000'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn-test.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-test.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health-test.json; then
              cat /tmp/health-test.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn-test.log
          exit 1
      - name: Production-like uvicorn health with generated secret
        env:
          G2B_DB_PATH: /tmp/g2b-prod-server.sqlite3
          G2B_AUTO_SYNC: '0'
          PORT: '8001'
        run: |
          set -euo pipefail
          uvicorn main:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn-prod.log 2>&1 &
          pid=$!
          trap 'cat /tmp/uvicorn-prod.log; kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health > /tmp/health-prod.json; then
              cat /tmp/health-prod.json
              python - <<'PY'
import json
with open('/tmp/health-prod.json', encoding='utf-8') as f:
    data = json.load(f)
assert data.get('status') == 'ok', data
assert data.get('configured') is True, data
assert data.get('version') == '2.0', data
print('PRODUCTION_HEALTH_OK')
PY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn-prod.log
          exit 1
