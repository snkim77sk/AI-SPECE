name: vnext-runtime-smoke

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Clean runtime import
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-clean-smoke.sqlite3
          G2B_TEST_MODE: '1'
          G2B_SETUP_TOKEN: ci-setup-token-1234567890
        run: |
          rm -f /tmp/g2b-vnext-clean-smoke.sqlite3
          python - <<'PY'
          import main
          import vnext_clean_app
          assert main.app is vnext_clean_app.app
          health = vnext_clean_app.health()
          assert health["status"] == "ok", health
          assert health["runtime"] == "G2B_VNEXT_CLEAN", health
          print("VNEXT_CLEAN_IMPORT_OK", health)
          PY
      - name: HTTP setup login dashboard and APIs
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-clean-http.sqlite3
          G2B_TEST_MODE: '1'
          G2B_SETUP_TOKEN: ci-setup-token-1234567890
        run: |
          set -euo pipefail
          rm -f /tmp/g2b-vnext-clean-http.sqlite3 /tmp/vnext-*.html /tmp/vnext.jar /tmp/vnext.headers
          PORT=8010 python run.py >/tmp/vnext-app.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-app.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8010/live >/tmp/vnext-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .25
          done
          test "$live" = 1

          ready=0
          for i in $(seq 1 80); do
            code=$(curl -sS -o /tmp/vnext-ready.json -w '%{http_code}' http://127.0.0.1:8010/ready || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            sleep .25
          done
          test "$ready" = 1

          curl -fsS http://127.0.0.1:8010/health >/tmp/vnext-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['backend_ok'] is True, data
          assert data['runtime']=='G2B_VNEXT_CLEAN', data
          assert data['required_boot_env'] == [], data
          assert 'raw_rows' not in data, data
          PY

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/)" = 302
          curl -fsS http://127.0.0.1:8010/setup -o /tmp/vnext-setup.html
          grep -q 'G2B vNext 최초 관리자' /tmp/vnext-setup.html

          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8010/setup             --data-urlencode 'setup_token=ci-setup-token-1234567890'             --data-urlencode 'username=admin1'             --data-urlencode 'password=AdminPassword123!'             --data-urlencode 'confirm=AdminPassword123!')" = 302

          curl -fsS http://127.0.0.1:8010/login -o /tmp/vnext-login.html
          grep -q 'SINSUNG G2B vNext' /tmp/vnext-login.html

          test "$(curl -sS -D /tmp/vnext.headers -c /tmp/vnext.jar -o /dev/null -w '%{http_code}'             -X POST http://127.0.0.1:8010/login             --data-urlencode 'username=admin1'             --data-urlencode 'password=AdminPassword123!')" = 302
          grep -qi '^set-cookie: g2b_vnext_session=' /tmp/vnext.headers

          curl -fsS -D /tmp/vnext-dashboard.headers -b /tmp/vnext.jar http://127.0.0.1:8010/dashboard -o /tmp/vnext-dashboard.html
          grep -q 'G2B vNext 대시보드' /tmp/vnext-dashboard.html
          grep -q '전체수집 → RAW 보존 → 정규화 → 후분류' /tmp/vnext-dashboard.html
          grep -qi '^x-frame-options: DENY' /tmp/vnext-dashboard.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/vnext-dashboard.headers
          grep -qi '^content-security-policy:' /tmp/vnext-dashboard.headers
          ! grep -q 'LED 조명 조달내역' /tmp/vnext-dashboard.html
          ! grep -q '업체별수주조회' /tmp/vnext-dashboard.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/shopping -o /tmp/vnext-shopping.html
          grep -q '쇼핑몰 납품요구' /tmp/vnext-shopping.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/goods -o /tmp/vnext-goods.html
          grep -q '물품 입찰공고' /tmp/vnext-goods.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/vendors -o /tmp/vnext-vendors.html
          grep -q '업체 분석' /tmp/vnext-vendors.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/budget -o /tmp/vnext-budget.html
          grep -q '예산 · 영업후보' /tmp/vnext-budget.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/service -o /tmp/vnext-service.html
          grep -q '용역 라이프사이클' /tmp/vnext-service.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/raw -o /tmp/vnext-raw.html
          grep -q 'RAW 저장소' /tmp/vnext-raw.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/settings -o /tmp/vnext-settings.html
          grep -q 'G2B_SERVICE_KEY 환경변수 필요' /tmp/vnext-settings.html
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/organize/budget)" = 403
          csrf=$(python - <<'PY'
          import re
          text=open('/tmp/vnext-settings.html',encoding='utf-8').read()
          block=text.split('action="/organize/budget"',1)[1].split('</form>',1)[0]
          match=re.search(r'name="_csrf" value="([^"]+)"', block)
          assert match
          print(match.group(1))
          PY
          )
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/organize/budget --data-urlencode "_csrf=$csrf")" = 303

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/shopping >/tmp/vnext-shopping.json
          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/goods >/tmp/vnext-goods.json
          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/vendors >/tmp/vnext-vendors.json

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/status >/tmp/vnext-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-status.json',encoding='utf-8'))
          assert data['status_scope']=='EXECUTION_READINESS_NOT_SOURCE_COMPLETENESS', data
          assert data['deployment_state']=='MAIN_ACTIVE', data
          assert data['main_merge_hold'] is False, data
          assert data['live_collection_mode']=='VALIDATION_ONLY', data
          PY

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/api/status)" = 401
          echo VNEXT_CLEAN_HTTP_SMOKE_OK

      - name: Fail-soft boot keeps HTTP alive when storage cannot open
        env:
          G2B_DB_PATH: /proc/g2b-vnext-unwritable.sqlite3
          G2B_TEST_MODE: '1'
        run: |
          set -euo pipefail
          PORT=8011 python run.py >/tmp/vnext-failsoft.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-failsoft.log; kill $pid 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8011/live >/tmp/vnext-live.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep .5
          done
          test "$ready" = 1

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8011/health -o /tmp/vnext-degraded-health.json
            if python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-degraded-health.json',encoding='utf-8'))
          raise SystemExit(0 if data.get('backend_error') else 1)
          PY
            then
              break
            fi
            sleep .1
          done
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-degraded-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['backend_ok'] is False, data
          assert data['runtime']=='G2B_VNEXT_CLEAN', data
          assert data['required_boot_env'] == [], data
          assert data['backend_error'], data
          print('VNEXT_FAILSOFT_HEALTH_OK', data['backend_error'].split(':',1)[0])
          PY

          code=$(curl -sS -o /tmp/vnext-ready.json -w '%{http_code}' http://127.0.0.1:8011/ready)
          test "$code" = 503
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-ready.json',encoding='utf-8'))
          assert data['status']=='not_ready', data
          assert data['backend_ok'] is False, data
          PY
          echo VNEXT_FAILSOFT_HTTP_ALIVE_OK

      - name: Slow SQLite cannot block HTTP port startup
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-locked.sqlite3
          G2B_SQLITE_TIMEOUT: '10'
          G2B_TEST_MODE: '1'
          G2B_SETUP_TOKEN: ci-setup-token-1234567890
        run: |
          set -euo pipefail
          rm -f /tmp/g2b-vnext-locked.sqlite3 /tmp/vnext-locked.log
          python - <<'PY' &
          import sqlite3,time
          path='/tmp/g2b-vnext-locked.sqlite3'
          conn=sqlite3.connect(path)
          conn.execute('CREATE TABLE IF NOT EXISTS lock_test(id INTEGER)')
          conn.commit()
          conn.execute('BEGIN EXCLUSIVE')
          time.sleep(12)
          conn.rollback()
          conn.close()
          PY
          lock_pid=$!
          sleep .3

          PORT=8012 python run.py >/tmp/vnext-locked.log 2>&1 &
          app_pid=$!
          trap 'cat /tmp/vnext-locked.log; kill $app_pid $lock_pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8012/live >/tmp/vnext-locked-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          curl -fsS http://127.0.0.1:8012/health >/tmp/vnext-locked-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-locked-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          print('VNEXT_NONBLOCKING_STARTUP_OK', data.get('backend_initializing'))
          PY

      - name: Runtime import failure still binds HTTP port
        env:
          G2B_TEST_MODE: '1'
        run: |
          set -euo pipefail
          rm -rf __pycache__
          mv vnext_clean_app.py vnext_clean_app.py.off
          PORT=8013 python run.py >/tmp/vnext-bootstrap.log 2>&1 &
          pid=$!
          trap 'mv vnext_clean_app.py.off vnext_clean_app.py 2>/dev/null || true; cat /tmp/vnext-bootstrap.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8013/live >/tmp/vnext-bootstrap-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          curl -fsS http://127.0.0.1:8013/health >/tmp/vnext-bootstrap-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-bootstrap-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['runtime']=='G2B_VNEXT_BOOTSTRAP', data
          assert data['import_ok'] is False, data
          assert data['import_error'], data
          print('VNEXT_IMPORT_FALLBACK_OK', data['import_error'].split(':',1)[0])
          PY
