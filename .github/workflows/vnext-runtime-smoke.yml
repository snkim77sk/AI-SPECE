name: vnext-runtime-smoke

on:
  push:
    branches:
      - main
      - 'rebuild/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Clean runtime import
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-clean-smoke.sqlite3
          G2B_TEST_MODE: '1'
        run: |
          rm -f /tmp/g2b-vnext-clean-smoke.sqlite3
          python - <<'PY'
          import os
          import main
          import vnext_clean_app
          assert main.app is vnext_clean_app.app
          health = vnext_clean_app.health()
          assert health["status"] == "ok", health
          assert health["runtime"] == "G2B_VNEXT_CLEAN", health
          assert health["build_commit"] == os.environ["GITHUB_SHA"].lower(), health
          print("VNEXT_CLEAN_IMPORT_OK", health)
          PY
      - name: Full runtime stays alive with backend HOLD
        env:
          G2B_TEST_MODE: '0'
          G2B_FULL_RUNTIME_ENABLE: '1'
          G2B_BACKEND_INIT_ENABLE: '0'
          G2B_POST_BOOT_MAINTENANCE_ENABLE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
        run: |
          set -euo pipefail
          PORT=8016 python -m uvicorn main:app --host 127.0.0.1 --port 8016 >/tmp/vnext-full-hold.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-full-hold.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8016/live >/tmp/vnext-full-hold-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1

          curl -fsS http://127.0.0.1:8016/health >/tmp/vnext-full-hold-health.json
          code=$(curl -sS -o /tmp/vnext-full-hold-ready.json -w '%{http_code}' http://127.0.0.1:8016/ready || true)
          test "$code" = 503

          python - <<'PY'
          import json
          live=json.load(open('/tmp/vnext-full-hold-live.json',encoding='utf-8'))
          health=json.load(open('/tmp/vnext-full-hold-health.json',encoding='utf-8'))
          ready=json.load(open('/tmp/vnext-full-hold-ready.json',encoding='utf-8'))
          assert live['status']=='ok', live
          assert live['runtime']=='G2B_VNEXT_CLEAN', live
          assert health['status']=='ok', health
          assert health['process_alive'] is True, health
          assert health['backend_ok'] is False, health
          assert health['backend_init_enabled'] is False, health
          assert health['post_boot_maintenance_enabled'] is False, health
          assert health['auto_sync_enabled'] is False, health
          assert ready['backend_init_enabled'] is False, ready
          assert ready['operational_ready'] is False, ready
          print('G2B_FULL_RUNTIME_BACKEND_HOLD_OK', health)
          PY

      - name: HTTP setup login dashboard and APIs
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-clean-http.sqlite3
          G2B_TEST_MODE: '1'
          G2B_RUNTIME_ROLE: RESULT_SERVER
        run: |
          set -euo pipefail
          rm -f /tmp/g2b-vnext-clean-http.sqlite3 /tmp/vnext-*.html /tmp/vnext.jar /tmp/vnext.headers
          PORT=8010 python run.py >/tmp/vnext-app.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-app.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8010/live >/tmp/vnext-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .25
          done
          test "$live" = 1

          ready=0
          for i in $(seq 1 80); do
            code=$(curl -sS -o /tmp/vnext-ready.json -w '%{http_code}' http://127.0.0.1:8010/ready || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            sleep .25
          done
          test "$ready" = 1

          curl -fsS http://127.0.0.1:8010/health >/tmp/vnext-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['backend_ok'] is True, data
          assert data['runtime']=='G2B_VNEXT_CLEAN', data
          assert data['runtime_role']=='RESULT_SERVER', data
          assert data['build_commit'], data
          assert data['result_snapshot_active'] is False, data
          assert data['required_boot_env'] == [], data
          assert 'raw_rows' not in data, data
          PY

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/)" = 302
          curl -fsS -c /tmp/vnext-setup.jar http://127.0.0.1:8010/setup -o /tmp/vnext-setup.html
          grep -q 'G2B vNext 최초 관리자' /tmp/vnext-setup.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8010/setup             --data-urlencode 'username=attacker'             --data-urlencode 'password=AdminPassword123!'             --data-urlencode 'confirm=AdminPassword123!')" = 403
          setup_csrf=$(python - <<'PY'
          import re
          text=open('/tmp/vnext-setup.html',encoding='utf-8').read()
          match=re.search(r'name="_setup_csrf" value="([^"]+)"', text)
          assert match
          print(match.group(1))
          PY
          )

          test "$(curl -sS -o /dev/null -b /tmp/vnext-setup.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/setup             --data-urlencode "_setup_csrf=$setup_csrf"             --data-urlencode 'username=admin1'             --data-urlencode 'password=AdminPassword123!'             --data-urlencode 'confirm=AdminPassword123!')" = 302

          curl -fsS http://127.0.0.1:8010/login -o /tmp/vnext-login.html
          grep -q 'SINSUNG G2B vNext' /tmp/vnext-login.html

          test "$(curl -sS -D /tmp/vnext.headers -c /tmp/vnext.jar -o /dev/null -w '%{http_code}'             -X POST http://127.0.0.1:8010/login             --data-urlencode 'username=admin1'             --data-urlencode 'password=AdminPassword123!')" = 302
          grep -qi '^set-cookie: g2b_vnext_session=' /tmp/vnext.headers

          curl -fsS -D /tmp/vnext-dashboard.headers -b /tmp/vnext.jar http://127.0.0.1:8010/dashboard -o /tmp/vnext-dashboard.html
          grep -q 'G2B vNext 대시보드' /tmp/vnext-dashboard.html
          grep -q "$(awk '{print $NF}' VERSION.txt)" /tmp/vnext-dashboard.html
          grep -q "${GITHUB_SHA:0:12}" /tmp/vnext-dashboard.html
          grep -q '미래예산 수집 → 기관·사업 정리 → 조명·등주 후보 · 사업자료 2026-01-01 이후' /tmp/vnext-dashboard.html
          grep -qi '^x-frame-options: DENY' /tmp/vnext-dashboard.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/vnext-dashboard.headers
          grep -qi '^content-security-policy:' /tmp/vnext-dashboard.headers
          ! grep -q 'LED 조명 조달내역' /tmp/vnext-dashboard.html
          ! grep -q '업체별수주조회' /tmp/vnext-dashboard.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/collection-monitor -o /tmp/vnext-collection-monitor.html
          grep -q '공식자료 수집 상태' /tmp/vnext-collection-monitor.html
          grep -q '교육청 예산' /tmp/vnext-collection-monitor.html
          grep -q 'http-equiv="refresh" content="5"' /tmp/vnext-collection-monitor.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/shopping -o /tmp/vnext-shopping.html
          grep -q 'LED 조명 조달내역' /tmp/vnext-shopping.html

          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' http://127.0.0.1:8010/goods)" = 404

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/vendors -o /tmp/vnext-vendors.html
          grep -q '업체 · 수주 분석' /tmp/vnext-vendors.html

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/budget -o /tmp/vnext-budget.html
          grep -q '예산 · 영업후보' /tmp/vnext-budget.html

          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' http://127.0.0.1:8010/service)" = 404
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' http://127.0.0.1:8010/api/service)" = 404

          # /raw was retired in 4.1; stale bookmarks must redirect to collection status.
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' http://127.0.0.1:8010/raw)" = 302

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/settings -o /tmp/vnext-settings.html
          grep -q 'API 키 설정' /tmp/vnext-settings.html
          grep -q '운영 버전' /tmp/vnext-settings.html
          grep -q "$(awk '{print $NF}' VERSION.txt)" /tmp/vnext-settings.html
          grep -q "${GITHUB_SHA:0:12}" /tmp/vnext-settings.html
          grep -q 'API 키를 먼저 저장하세요' /tmp/vnext-settings.html
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/settings/keys)" = 403
          key_csrf=$(python - <<'PY'
          import re
          text=open('/tmp/vnext-settings.html',encoding='utf-8').read()
          block=text.split('action="/settings/keys"',1)[1].split('</form>',1)[0]
          match=re.search(r'name="_csrf" value="([^"]+)"', block)
          assert match
          print(match.group(1))
          PY
          )
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/settings/keys \
            --data-urlencode "_csrf=$key_csrf" \
            --data-urlencode 'action=save' \
            --data-urlencode 'g2b_service_key=smoke-g2b-key' \
            --data-urlencode 'lofin_api_key=smoke-lofin-key' \
            --data-urlencode 'eduinfo_api_key=smoke-eduinfo-key')" = 303
          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/settings -o /tmp/vnext-settings-saved.html
          test "$(grep -o '<b>저장됨</b>' /tmp/vnext-settings-saved.html | wc -l)" -ge 2
          grep -q '실제 원천 API 응답은 아직 확인하지 않음' /tmp/vnext-settings-saved.html
          grep -q '<b>KEY</b><span>지방교육재정알리미 키</span>' /tmp/vnext-settings-saved.html
          ! grep -q 'smoke-g2b-key' /tmp/vnext-settings-saved.html
          ! grep -q 'smoke-lofin-key' /tmp/vnext-settings-saved.html
          ! grep -q 'smoke-eduinfo-key' /tmp/vnext-settings-saved.html

          ! grep -q 'action="/organize/budget"' /tmp/vnext-settings.html
          grep -q '호환 동기화 토큰 발급' /tmp/vnext-settings.html
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/organize/budget)" = 409
          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' -X POST http://127.0.0.1:8010/collect/shopping-recent)" = 409

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/shopping >/tmp/vnext-shopping.json
          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/vendors >/tmp/vnext-vendors.json

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/status >/tmp/vnext-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-status.json',encoding='utf-8'))
          assert data['status_scope']=='EXECUTION_READINESS_NOT_SOURCE_COMPLETENESS', data
          assert data['deployment_state']=='V4_BUDGET_CENTERED', data
          assert data['main_merge_hold'] is False, data
          assert data['live_collection_mode']=='NORMALIZED_BUDGET_PLUS_NORMALIZED_TARGET_SHOPPING', data
          assert data['credentials']['g2b_service_key_configured'] is True, data
          assert data['credentials']['lofin_api_key_configured'] is True, data
          assert data['credentials']['eduinfo_api_key_configured'] is True, data
          assert data['education_budget_key_status']=='KEY_CONFIGURED_LIVE_HOLD', data
          assert data['education_budget_live_transport_hold'] is True, data
          PY

          curl -fsS -b /tmp/vnext.jar http://127.0.0.1:8010/api/collection-status >/tmp/vnext-collection-status.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-collection-status.json',encoding='utf-8'))
          assert data['source_io_performed'] is False, data
          assert data['collection_controls_enabled'] is False, data
          assert data['operational_recent']['order'] == 'FORWARD', data
          assert data['summary']['stage_count'] == 4, data
          assert len(data['stages']) == 4, data
          assert data['safety']['service_collection_removed'] is True, data
          assert data['safety']['goods_bid_collection_removed'] is True, data
          assert data['safety']['education_live_transport_hold'] is True, data
          PY

          test "$(curl -sS -o /dev/null -b /tmp/vnext.jar -w '%{http_code}' http://127.0.0.1:8010/api/goods)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/api/status)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/api/collection-status)" = 401
          echo VNEXT_CLEAN_HTTP_SMOKE_OK

      - name: Fail-soft boot keeps HTTP alive when storage cannot open
        env:
          G2B_DB_PATH: /proc/g2b-vnext-unwritable.sqlite3
          G2B_TEST_MODE: '1'
        run: |
          set -euo pipefail
          PORT=8011 python run.py >/tmp/vnext-failsoft.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-failsoft.log; kill $pid 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8011/live >/tmp/vnext-live.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep .5
          done
          test "$ready" = 1

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8011/health -o /tmp/vnext-degraded-health.json
            if python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-degraded-health.json',encoding='utf-8'))
          raise SystemExit(0 if data.get('backend_error') else 1)
          PY
            then
              break
            fi
            sleep .1
          done
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-degraded-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['backend_ok'] is False, data
          assert data['runtime']=='G2B_VNEXT_CLEAN', data
          assert data['required_boot_env'] == [], data
          assert data['backend_error'], data
          print('VNEXT_FAILSOFT_HEALTH_OK', data['backend_error'].split(':',1)[0])
          PY

          code=$(curl -sS -o /tmp/vnext-ready.json -w '%{http_code}' http://127.0.0.1:8011/ready)
          test "$code" = 503
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-ready.json',encoding='utf-8'))
          assert data['status']=='not_ready', data
          assert data['backend_ok'] is False, data
          PY
          echo VNEXT_FAILSOFT_HTTP_ALIVE_OK

      - name: Slow SQLite cannot block HTTP port startup
        env:
          G2B_DB_PATH: /tmp/g2b-vnext-locked.sqlite3
          G2B_SQLITE_TIMEOUT: '10'
          G2B_TEST_MODE: '1'
        run: |
          set -euo pipefail
          rm -f /tmp/g2b-vnext-locked.sqlite3 /tmp/vnext-locked.log
          python - <<'PY' &
          import sqlite3,time
          path='/tmp/g2b-vnext-locked.sqlite3'
          conn=sqlite3.connect(path)
          conn.execute('CREATE TABLE IF NOT EXISTS lock_test(id INTEGER)')
          conn.commit()
          conn.execute('BEGIN EXCLUSIVE')
          time.sleep(12)
          conn.rollback()
          conn.close()
          PY
          lock_pid=$!
          sleep .3

          PORT=8012 python run.py >/tmp/vnext-locked.log 2>&1 &
          app_pid=$!
          trap 'cat /tmp/vnext-locked.log; kill $app_pid $lock_pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8012/live >/tmp/vnext-locked-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          curl -fsS http://127.0.0.1:8012/health >/tmp/vnext-locked-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vnext-locked-health.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          print('VNEXT_NONBLOCKING_STARTUP_OK', data.get('backend_initializing'))
          PY

      - name: Emergency recovery binds with stdlib only
        env:
          G2B_TEST_MODE: '0'
          G2B_FULL_RUNTIME_ENABLE: '0'
          G2B_BUILD_COMMIT: 'deadbeefdeadbeefdeadbeefdeadbeefdeadbeef'
        run: |
          set -euo pipefail
          git rev-parse HEAD >/tmp/g2b-expected-checkout.txt
          PORT=8014 python run.py >/tmp/vnext-emergency.log 2>&1 &
          pid=$!
          trap 'cat /tmp/vnext-emergency.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS -D /tmp/vnext-emergency.headers http://127.0.0.1:8014/live >/tmp/vnext-emergency-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1

          curl -fsS http://127.0.0.1:8014/health >/tmp/vnext-emergency-health.json
          curl -fsS http://127.0.0.1:8014/ready >/tmp/vnext-emergency-ready.json
          curl -fsS http://127.0.0.1:8014/ >/tmp/vnext-emergency-root.html
          sleep .2
          curl -fsS http://127.0.0.1:8014/live >/tmp/vnext-emergency-live2.json

          python - <<'PY'
          import json
          live=json.load(open('/tmp/vnext-emergency-live.json',encoding='utf-8'))
          live2=json.load(open('/tmp/vnext-emergency-live2.json',encoding='utf-8'))
          health=json.load(open('/tmp/vnext-emergency-health.json',encoding='utf-8'))
          ready=json.load(open('/tmp/vnext-emergency-ready.json',encoding='utf-8'))
          assert live['status']=='ok', live
          assert live['runtime']=='G2B_EMERGENCY_HTTP_RECOVERY', live
          assert live['version']=='4.1.157', live
          assert live['phase']=='PHASE0_EMERGENCY_HTTP', live
          assert live['full_runtime_enable'] is False, live
          assert live['backend_init_enable'] is False, live
          assert live['post_boot_maintenance_enable'] is False, live
          assert live['auto_sync_requested'] is False, live
          assert live['database_touched'] is False, live
          assert live['build_commit'], live
          assert live['build_commit_source']=='GITHUB_SHA', live
          expected=open('/tmp/g2b-expected-checkout.txt',encoding='utf-8').read().strip().lower()
          assert live['git_checkout_commit']==expected, live
          assert live['configured_build_commit'].startswith('deadbeef'), live
          assert live['build_commit_mismatch'] is True, live
          assert live['source_fingerprint_complete'] is True, live
          assert len(live['source_fingerprint']) == 64, live
          assert live['source_fingerprint_manifest']=='G2B_CORE_SOURCE_V1', live
          assert live['process_instance_id'], live
          assert len(live['process_instance_id']) == 24, live
          int(live['process_instance_id'], 16)
          assert live['process_started_at_utc'].endswith('Z'), live
          assert live['process_uptime_seconds'] >= 0, live
          assert live2['process_instance_id'] == live['process_instance_id'], (live, live2)
          assert live2['process_started_at_utc'] == live['process_started_at_utc'], (live, live2)
          assert live2['process_uptime_seconds'] >= live['process_uptime_seconds'], (live, live2)
          assert health['status']=='ok', health
          assert health['database_touched'] is False, health
          assert health['phase']=='PHASE0_EMERGENCY_HTTP', health
          assert ready['status']=='recovery_ready', ready
          assert ready['phase']=='PHASE0_EMERGENCY_HTTP', ready
          print('G2B_EMERGENCY_HTTP_RECOVERY_OK', live)
          PY
          grep -qi '^x-g2b-version: 4.1.157' /tmp/vnext-emergency.headers
          grep -qi '^x-g2b-recovery-phase: PHASE0_EMERGENCY_HTTP' /tmp/vnext-emergency.headers
          grep -qi '^x-g2b-build-commit:' /tmp/vnext-emergency.headers
          grep -qi '^x-g2b-build-commit-source: GITHUB_SHA' /tmp/vnext-emergency.headers
          grep -qi '^x-g2b-source-fingerprint:' /tmp/vnext-emergency.headers
          grep -q 'G2B_RECOVERY_GATE_STATE' /tmp/vnext-emergency.log
          python - <<'PY'
          import os
          import runtime_identity
          expected=open('/tmp/g2b-expected-checkout.txt',encoding='utf-8').read().strip().lower()
          os.environ.pop('GITHUB_SHA', None)
          info=runtime_identity.build_commit_info()
          assert info['build_commit']==expected, info
          assert info['build_commit_source']=='GIT_CHECKOUT', info
          assert info['build_commit_checkout_authoritative'] is True, info
          assert info['build_commit_mismatch'] is True, info
          print('G2B_GIT_CHECKOUT_IDENTITY_OK', info['build_commit'][:12])
          PY
          grep -q '응급 복구모드' /tmp/vnext-emergency-root.html

      - name: Emergency ASGI entrypoint bypasses full runtime
        env:
          G2B_TEST_MODE: '0'
          G2B_FULL_RUNTIME_ENABLE: '0'
        run: |
          set -euo pipefail
          rm -rf __pycache__
          mv vnext_clean_app.py vnext_clean_app.py.off
          mv g2b_database.py g2b_database.py.off
          PORT=8015 python -m uvicorn main:app --host 127.0.0.1 --port 8015 >/tmp/vnext-emergency-asgi.log 2>&1 &
          pid=$!
          trap 'mv vnext_clean_app.py.off vnext_clean_app.py 2>/dev/null || true; mv g2b_database.py.off g2b_database.py 2>/dev/null || true; cat /tmp/vnext-emergency-asgi.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
