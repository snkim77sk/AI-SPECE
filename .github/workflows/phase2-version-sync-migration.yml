name: phase2-version-sync-migration

on:
  push:
    branches:
      - refactor/phase2-2026-08-17
    paths:
      - scripts/phase2_version_sync.py
      - .github/workflows/phase2-version-sync-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase2-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded version migration
        run: python scripts/phase2_version_sync.py
      - name: Verify intended source changes
        run: |
          set -euo pipefail
          git diff --check
          test -f app_version.py
          grep -q 'from app_version import APP_VERSION' app.py
          grep -q 'from app_version import APP_VERSION' server.py
          ! grep -q "APP_VERSION = '2.4.0-sinsung-groups-auth'" server.py
          ! grep -q 'APP_VERSION = "2.4.1-api-status-unified"' app.py
          ! grep -R -n --include='sinsung_*.py' 's\.APP_VERSION = VERSION' .
      - name: Commit migration result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_version.py main.py app.py server.py sinsung_v220_app.py sinsung_runtime_fix.py sinsung_ui_restore.py sinsung_region_fix.py sinsung_budget_monitor.py sinsung_v251_patch.py sinsung_v252_patch.py sinsung_v220_ui.py
          git diff --cached --quiet && { echo 'No migration changes'; exit 1; }
          git commit -m 'Use VERSION.txt as canonical application version'
          git push origin HEAD:refactor/phase2-2026-08-17
