name: g2b-4.1.273-70s-liveness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g2b_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g2b_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and sync 4.1.273
        run: |
          set -euo pipefail
          python -m pip install uv
          uv sync --directory . --no-dev
          test "$(cat VERSION.txt)" = "SINSUNG G2B VNEXT 4.1.273"

      - name: Verify production auto-sync 256MiB preflight without source calls
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC_DISABLE: '0'
          G2B_SERVICE_KEY: ''
          LOFIN_API_KEY: ''
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import safe_boot_vnext as guard
          from runtime_role import automatic_collection_enabled
          assert automatic_collection_enabled(test_mode=False)
          assert guard.boot_grace_remaining(100, low_memory=True, now=100)==300
          budget={
              'guard_ok':True,
              'cgroup_oom_group':0,
              'cgroup_limit_mib':256,
              'cgroup_effective_mib':95,
          }
          allowed,reason=guard.child_admission(budget, worker_soft_limit_mib=112)
          assert not allowed and reason=='CGRP_CHILD_HEADROOM_UNSAFE', (allowed,reason)
          budget['cgroup_limit_mib']=0
          assert guard.child_admission(budget)[0] is False
          print('G2B_4_1_260_AUTO_ENABLED_256MIB_PREFLIGHT_OK')
          PY

      - name: Survive 70 seconds without delayed heavy work
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_POST_BOOT_MAINTENANCE_ENABLE: '0'
          G2B_MATCH_ROLLOVER_AUTO_ENABLE: '0'
          G2B_V41_FRESH_START: '1'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '1'
          G2B_MEMORY_SOFT_LIMIT_MB: '160'
          G2B_ISOLATED_WORKER_SOFT_LIMIT_MB: '112'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
          G2B_DB_CONNECT_TIMEOUT_SECONDS: '3'
        run: |
          set -euo pipefail

          PORT=8019 .venv/bin/python run.py >/tmp/g2b-238-70s.log 2>&1 &
          pid=$!
          echo "$pid" >/tmp/g2b-217.pid
          trap 'cat /tmp/g2b-238-70s.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8019/live >/tmp/g2b-238-live-initial.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1

          ready=0
          for i in $(seq 1 160); do
            code=$(curl -sS -o /tmp/g2b-238-ready.json -w '%{http_code}' http://127.0.0.1:8019/ready || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            sleep .25
          done
          test "$ready" = 1

          for second in 5 10 15 20 25 30 35 40 45 50 55 60 65 70; do
            sleep 5
            kill -0 "$pid"
            curl -fsS http://127.0.0.1:8019/live >"/tmp/g2b-238-live-${second}.json"
            if [ "$second" = 45 ] || [ "$second" = 70 ]; then
              curl -fsS http://127.0.0.1:8019/health >"/tmp/g2b-238-health-${second}.json"
            fi
            echo "G2B_4_1_260_LIVE_${second}S"
            ps -o pid=,rss=,vsz=,etime= -p "$pid"
          done

          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          live=json.load(open('/tmp/g2b-238-live-70.json',encoding='utf-8'))
          health45=json.load(open('/tmp/g2b-238-health-45.json',encoding='utf-8'))
          health70=json.load(open('/tmp/g2b-238-health-70.json',encoding='utf-8'))

          assert live['status']=='ok', live
          assert live['process_alive'] is True, live
          assert live['runtime']=='G2B_VNEXT_CLEAN', live
          assert live['version']=='4.1.273', live

          for health in (health45, health70):
              assert health['status']=='ok', health
              assert health['process_alive'] is True, health
              assert health['backend_ok'] is True, health
              assert health['operational_ready'] is True, health
              assert health['post_boot_maintenance_enabled'] is False, health
              assert health['memory_guard_ok'] is True, health
              assert int(health['memory_cgroup_oom_kill']) == 0, health
              assert float(health['memory_rss_mib']) < float(health['memory_soft_limit_mib']), health

          pid=Path('/tmp/g2b-217.pid').read_text(encoding='utf-8').strip()
          status=Path(f'/proc/{pid}/status').read_text(encoding='utf-8')
          values={}
          for line in status.splitlines():
              if ':' in line:
                  key,value=line.split(':',1)
                  values[key.strip()]=value.strip()
          peak_kib=int(values.get('VmHWM','0 kB').split()[0])
          assert peak_kib < 160 * 1024, values
          print('G2B_4_1_260_70S_LIVENESS_OK', {
              'rss_45': health45['memory_rss_mib'],
              'rss_70': health70['memory_rss_mib'],
              'peak_rss_mib': round(peak_kib/1024.0,2),
              'oom_kill': health70['memory_cgroup_oom_kill'],
          })
          PY

          if pgrep -P "$pid" -f 'g2b_heavy_worker' >/dev/null 2>&1; then
            echo "unexpected heavy worker during idle liveness gate"
            exit 1
          fi

      - name: Real PostgreSQL advisory lease and two-slot pool concurrency
        env:
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_DB_POOL_SIZE: '1'
          G2B_DB_MAX_OVERFLOW: '1'
          G2B_DB_POOL_TIMEOUT_SECONDS: '2'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import psycopg
          import g2b_database
          dsn="postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test"
          with g2b_database.operational_source_cycle_lease("shopping") as acquired:
              assert acquired is True
              engine=g2b_database.engine()
              with engine.connect() as web1, engine.connect() as web2:
                  assert web1.exec_driver_sql("SELECT 1").scalar() == 1
                  assert web2.exec_driver_sql("SELECT 1").scalar() == 1
                  with psycopg.connect(dsn, autocommit=True) as observer:
                      row=observer.execute(
                          "SELECT state FROM pg_stat_activity "
                          "WHERE application_name='g2b_v41_operational_lease' "
                          "ORDER BY backend_start DESC LIMIT 1"
                      ).fetchone()
                      assert row and row[0] == "idle", row
                      assert observer.execute(
                          "SELECT pg_try_advisory_lock(hashtext(%s))",
                          ("g2b_v41_operational_cycle",),
                      ).fetchone()[0] is False
                      assert observer.execute(
                          "SELECT pg_try_advisory_lock(hashtext(%s))",
                          ("g2b_v41_manual_shopping",),
                      ).fetchone()[0] is False
          with psycopg.connect(dsn, autocommit=True) as observer:
              assert observer.execute(
                  "SELECT pg_try_advisory_lock(hashtext(%s))",
                  ("g2b_v41_manual_shopping",),
              ).fetchone()[0] is True
          print("G2B_4_1_260_LEASE_AUTOCOMMIT_AND_2_DATA_POOL_CONNECTIONS_OK")
          PY


      - name: Concurrent cold web pool initialization with real PostgreSQL
        env:
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_DB_POOL_SIZE: '1'
          G2B_DB_MAX_OVERFLOW: '1'
          G2B_DB_POOL_TIMEOUT_SECONDS: '5'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import concurrent.futures
          import threading
          import g2b_database

          # Ten simulated simultaneous first menu reads must share exactly
          # one QueuePool while the regular web/worker PostgreSQL contract holds.
          g2b_database.reset_engine_cache()
          gate = threading.Barrier(10)

          def read_once(_):
              gate.wait(timeout=5)
              engine = g2b_database.engine()
              with engine.connect() as conn:
                  assert conn.exec_driver_sql("SELECT 1").scalar() == 1
              return engine

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as workers:
              engines = list(workers.map(read_once, range(10)))
          assert all(engine is engines[0] for engine in engines), (
              "CONCURRENT_MENU_CREATED_MULTIPLE_PG_POOLS"
          )
          assert engines[0].pool.size() == 1
          assert engines[0].pool._max_overflow == 1
          assert engines[0].pool.checkedout() == 0
          print("G2B_4_1_262_COLD_MENU_SINGLE_PG_POOL_OK", {
              "threads":len(engines), "same_pool":True,
              "pool_size":1, "max_overflow":1, "checked_out":0,
              "external_api_calls":0, "business_data_modified":False
          })
          PY

      - name: Concurrent authenticated menus and heartbeat against PostgreSQL
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_POST_BOOT_MAINTENANCE_ENABLE: '0'
          G2B_MATCH_ROLLOVER_AUTO_ENABLE: '0'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
          G2B_MEMORY_SOFT_LIMIT_MB: '160'
          G2B_DB_POOL_SIZE: '1'
          G2B_DB_MAX_OVERFLOW: '1'
          G2B_DB_POOL_TIMEOUT_SECONDS: '2'
        run: |
          set -euo pipefail
          PORT=8023 .venv/bin/python run.py >/tmp/g2b-251-concurrent.log 2>&1 &
          pid=$!
          trap 'cat /tmp/g2b-251-concurrent.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8023/live >/dev/null 2>&1; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1

          ready=0
          for i in $(seq 1 160); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8023/ready || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            sleep .25
          done
          test "$ready" = 1

          .venv/bin/python - <<'PY'
          import concurrent.futures
          import json
          import threading
          import time
          import urllib.error
          import urllib.request
          import subprocess
          import sys
          import memory_guard
          import psycopg

          from vnext_clean_db import create_admin, create_session, users_empty

          if users_empty():
              create_admin("ci_pool_operator", "G2B_CI_Pool_Safe_2026!")
          token = create_session("ci_pool_operator")
          root = "http://127.0.0.1:8023"
          paths = [
              "/dashboard", "/api/dashboard-summary", "/collection-monitor",
              "/shopping", "/vendors", "/budget", "/settings",
              "/api/status", "/api/shopping", "/api/vendors",
              "/api/budget", "/api/collection-status",
          ]
          barrier = threading.Barrier(len(paths))

          def hit(path):
              barrier.wait(timeout=5)
              begin = time.monotonic()
              request = urllib.request.Request(
                  root + path,
                  headers={"Cookie": "g2b_vnext_session=" + token},
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      url = response.geturl()
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  url = exc.url
                  body = exc.read()
              duration = round(time.monotonic() - begin, 3)
              assert not url.rstrip("/").endswith("/login"), (path, status, url)
              assert status in {200, 503}, (path, status, body[:300])
              if status == 503:
                  assert (
                      b"WEB_DB_BUSY_RETRY" in body
                      or b"WEB_DB_CONNECTION_UNAVAILABLE" in body
                      or "조회가 잠시 지연" in body.decode("utf-8", errors="replace")
                      or b"TEMPORARILY_UNAVAILABLE" in body
                  ), (path, body[:300])
              return (path, status, duration)

          # Source-free *separate OS process* holds the same advisory lease
          # used by an isolated shopping collector while 12 menus hit web/PG.
          # It never requests external APIs or inserts business data.
          lease_script = (
              "import time, g2b_database\n"
              "payload = bytearray(48 * 1024 * 1024)\n"
              "for page in range(0, len(payload), 4096):\n"
              "    payload[page] = 1\n"
              "with g2b_database.operational_source_cycle_lease('shopping') as ok:\n"
              "    assert ok, 'PG_SHOPPING_SOURCE_LEASE_UNAVAILABLE'\n"
              "    print('PG_SHOPPING_CHILD_LEASE_ACTIVE', flush=True)\n"
              "    time.sleep(12)\n"
          )
          lease_child = subprocess.Popen(
              [sys.executable, "-B", "-c", lease_script],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          try:
              marker = lease_child.stdout.readline().strip()
              assert marker == "PG_SHOPPING_CHILD_LEASE_ACTIVE", marker[:100]
              # The disposable child has touched at least 48MiB of real
              # memory while holding its source advisory session.
              child_rss_mib = 0.0
              with open(f"/proc/{lease_child.pid}/status",encoding="utf-8") as proc:
                  for line in proc:
                      if line.startswith("VmRSS:"):
                          child_rss_mib = round(int(line.split()[1])/1024,2)
                          break
              assert child_rss_mib >= 48, child_rss_mib
              cgroup_running = memory_guard.container_budget_snapshot()
              with psycopg.connect(
                  "postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test",
                  autocommit=True,
              ) as observer:
                  pg_source_sessions = observer.execute(
                      "SELECT COUNT(*) FROM pg_stat_activity "
                      "WHERE application_name=%s",
                      ("g2b_v41_operational_lease",),
                  ).fetchone()[0]
              assert pg_source_sessions >= 1, pg_source_sessions

              with concurrent.futures.ThreadPoolExecutor(max_workers=len(paths)) as pool:
                  futures = [pool.submit(hit, path) for path in paths]
                  before = time.monotonic()
                  with urllib.request.urlopen(root + "/live", timeout=3) as health:
                      assert health.status == 200
                  heartbeat_seconds = time.monotonic() - before
                  results = [future.result(timeout=15) for future in futures]

              assert any(status == 200 for _, status, _ in results), results
              assert heartbeat_seconds < 3, heartbeat_seconds
              max_http_seconds = max(seconds for _, _, seconds in results)
              assert max_http_seconds < 6, max_http_seconds
              with urllib.request.urlopen(root + "/health", timeout=3) as response:
                  health = json.load(response)
              assert health["status"] == "ok", health
              assert health["memory_guard_ok"] is True, health
              assert health["memory_cgroup_oom_kill"] == 0, health
              assert lease_child.poll() is None, "PG_LEASE_CHILD_EXITED_DURING_MENUS"
              print("G2B_4_1_263_CONCURRENT_MENUS_WITH_SOURCE_LEASE_CHILD_OK", {
                  "results": results,
                  "live_seconds": round(heartbeat_seconds, 3),
                  "rss_mib": health["memory_rss_mib"],
                  "oom_kill": health["memory_cgroup_oom_kill"],
                  "source_lease_child_alive": lease_child.poll() is None,
                  "source_child_rss_mib": child_rss_mib,
                  "cgroup_source": cgroup_running["source"],
                  "observed_cgroup_limit_mib": cgroup_running["limit_mib"],
                  "observed_cgroup_effective_mib": cgroup_running["effective_mib"],
                  "pg_source_lease_sessions": pg_source_sessions,
                  "max_http_seconds": max_http_seconds,
                  "data_modified_by_child": False,
                  "external_source_api_calls": 0,
              })
          finally:
              if lease_child.poll() is None:
                  lease_child.terminate()
              try:
                  lease_child.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  lease_child.kill()
                  lease_child.wait(timeout=3)
              if lease_child.stdout:
                  lease_child.stdout.close()
          PY


      - name: Real PostgreSQL blocked login keeps /live responsive
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_POST_BOOT_MAINTENANCE_ENABLE: '0'
          G2B_MATCH_ROLLOVER_AUTO_ENABLE: '0'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
          G2B_MEMORY_SOFT_LIMIT_MB: '160'
        run: |
          set -euo pipefail
          PORT=8024 .venv/bin/python run.py >/tmp/g2b-252-login.log 2>&1 &
          pid=$!
          trap 'cat /tmp/g2b-252-login.log; kill $pid 2>/dev/null || true' EXIT
          live=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8024/live >/dev/null 2>&1; then live=1; break; fi
            sleep .1
          done
          test "$live" = 1
          ready=0
          for i in $(seq 1 160); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8024/ready || true)
            if [ "$status" = 200 ]; then ready=1; break; fi
            sleep .25
          done
          test "$ready" = 1
          .venv/bin/python - <<'PY'
          import concurrent.futures
          import http.client
          import json
          import time
          from urllib.parse import urlencode
          import urllib.request
          import psycopg

          def login():
              data=urlencode({"username":"ci_pool_operator","password":"G2B_CI_Pool_Safe_2026!"})
              conn=http.client.HTTPConnection("127.0.0.1",8024,timeout=7)
              try:
                  conn.request("POST","/login",body=data,headers={"Content-Type":"application/x-www-form-urlencoded"})
                  reply=conn.getresponse()
                  reply.read()
                  return reply.status,reply.getheader("Location")
              finally:
                  conn.close()

          with psycopg.connect("postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test") as pg:
              pg.execute("LOCK TABLE g2b_app_live207.vnext_users IN ACCESS EXCLUSIVE MODE")
              with concurrent.futures.ThreadPoolExecutor(max_workers=1) as pool:
                  pending=pool.submit(login)
                  time.sleep(0.4)
                  assert not pending.done(), "locked login did not wait for PG"
                  started=time.monotonic()
                  with urllib.request.urlopen("http://127.0.0.1:8024/live",timeout=2) as live:
                      assert live.status==200
                  elapsed=time.monotonic()-started
                  assert elapsed<1.5,elapsed
                  pg.rollback()
                  status,location=pending.result(timeout=6)
                  assert (status,location)==(302,"/dashboard"),(status,location)
          with urllib.request.urlopen("http://127.0.0.1:8024/health",timeout=2) as req:
              health=json.load(req)
          assert health["status"]=="ok" and health["memory_guard_ok"] is True,health
          assert int(health["memory_cgroup_oom_kill"])==0,health
          print("G2B_4_1_260_BLOCKED_LOGIN_HEARTBEAT_OK",{"live_seconds":round(elapsed,3),"rss_mib":health["memory_rss_mib"],"oom_kill":health["memory_cgroup_oom_kill"]})
          PY


      - name: Verify 256MiB automatic worker queue and supervisor completion are bounded
        env:
          G2B_TEST_MODE: '1'
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python pytest
          .venv/bin/python -m pytest -q tests/test_g2b_4253_auto_worker_lifecycle.py
          echo G2B_4_1_260_AUTO_WORKER_QUEUE_AND_SUPERVISOR_GUARD_OK


      - name: Real isolated PostgreSQL child with no source keys keeps HTTP alive
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_POST_BOOT_MAINTENANCE_ENABLE: '0'
          G2B_MATCH_ROLLOVER_AUTO_ENABLE: '0'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
          G2B_SERVICE_KEY: ''
          LOFIN_API_KEY: ''
          EDUINFO_API_KEY: ''
          G2B_MEMORY_SOFT_LIMIT_MB: '160'
          G2B_ISOLATED_WORKER_SOFT_LIMIT_MB: '112'
        run: |
          set -euo pipefail
          PORT=8026 .venv/bin/python run.py >/tmp/g2b-253-web.log 2>&1 &
          webpid=$!
          trap 'cat /tmp/g2b-253-web.log; cat /tmp/g2b-253-child.log 2>/dev/null || true; kill $webpid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8026/live >/dev/null 2>&1; then live=1; break; fi
            sleep .1
          done
          test "$live" = 1
          ready=0
          for i in $(seq 1 160); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8026/ready || true)
            if [ "$code" = 200 ]; then ready=1; break; fi
            sleep .25
          done
          test "$ready" = 1

          # No credentials are provided or present in this fresh ephemeral test
          # database; the child must stop at WAITING_KEYS without source HTTP I/O.
          timeout 60s .venv/bin/python -B -m g2b_heavy_worker shopping >/tmp/g2b-253-child.log 2>&1 &
          childpid=$!
          for i in $(seq 1 40); do
            kill -0 "$webpid"
            curl -fsS --max-time 2 http://127.0.0.1:8026/live >/dev/null
            sleep .25
          done
          set +e
          wait "$childpid"
          childexit=$?
          set -e
          test "$childexit" = 72
          grep -q 'G2B_HEAVY_WORKER_SOURCE_STATE shopping WAITING_KEYS 72' /tmp/g2b-253-child.log
