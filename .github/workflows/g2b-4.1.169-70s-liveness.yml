      - name: Real PostgreSQL SIGKILL during a budget page transaction resumes without replay
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import os
          import signal
          import subprocess
          import sys
          import textwrap

          import budget_pg_collection as collector
          import budget_pg_store as store
          import vnext_source_guard as source

          # Synthetic rows only. The source transport is intentionally replaced
          # inside this isolated PostgreSQL test; no LOFIN API calls/keys used.
          scope = "2026:2026-09-28:SIGKILL4255"
          row_a = {"fyr":"2026","dbiz_cd":"SIGKILL4255-A","amount":100}
          row_b = {"fyr":"2026","dbiz_cd":"SIGKILL4255-B","amount":200}

          child = textwrap.dedent("""
              import os
              import signal
              import budget_pg_store as store
              import budget_pg_collection as collector
              import vnext_source_guard as source
              source.require_attested_transport_result = lambda before, value, **kw: value

              def fetch(page, size):
                  return ([{"fyr":"2026",
                            "dbiz_cd":"SIGKILL4255-A" if page==1 else "SIGKILL4255-B",
                            "amount":100 if page==1 else 200}], 2)

              real_preserve = store.preserve_observation
              def interrupt_mid_transaction(dataset, record_key, payload, **kwargs):
                  result = real_preserve(dataset, record_key, payload, **kwargs)
                  if record_key == "SIGKILL4255-B":
                      os.kill(os.getpid(), signal.SIGKILL)
                  return result
              store.preserve_observation = interrupt_mid_transaction

              collector.collect_pages(
                  dataset="budget",
                  scope="2026:2026-09-28:SIGKILL4255",
                  range_start="2026", range_end="2026-09-28",
                  page_size=1, max_pages=2, resume=True,
                  fetch=fetch,
                  identity=lambda row: str(row["dbiz_cd"]),
                  source_system="LOFIN", source_operation="QWGJK",
                  source_date=lambda row: "2026-09-28",
                  checkpoint_contract="SIGKILL_TX_PROBE_4255",
              )
          """)
          proc = subprocess.run(
              [sys.executable, "-B", "-c", child],
              capture_output=True, text=True, timeout=25,
              env=os.environ.copy(),
          )
          assert proc.returncode == -signal.SIGKILL, (
              proc.returncode, proc.stdout[-1500:], proc.stderr[-1500:]
          )
          cp = store.get_checkpoint("budget", scope)
          assert cp is not None and cp["status"]=="RUNNING", cp
          assert int(cp["page_no"]) == 2, cp
          assert int(cp["fetched_count"]) == 1, cp
          assert int(cp["saved_count"]) == 1, cp
          assert collector.verified_checkpoint(cp), cp
          generation = json.loads(cp["cursor_value"])["generation"]
          assert store.current_payload_hash("budget", "SIGKILL4255-B") == "", (
              "Uncommitted page2 observation survived SIGKILL"
          )

          # Recovery uses a fresh engine (new process-equivalent), the same
          # signed receipt generation, and fetches ONLY the interrupted page.
          store.reset_engine_cache()
          source.require_attested_transport_result = lambda before, value, **kw: value
          fetched = []
          def recover(page, size):
              fetched.append(page)
              assert page == 2 and size == 1, (page,size)
              return [row_b], 2
          finished = collector.collect_pages(
              dataset="budget", scope=scope,
              range_start="2026", range_end="2026-09-28",
              page_size=1, max_pages=2, resume=True,
              fetch=recover,
              identity=lambda row: str(row["dbiz_cd"]),
              source_system="LOFIN", source_operation="QWGJK",
              source_date=lambda row: "2026-09-28",
              checkpoint_contract="SIGKILL_TX_PROBE_4255",
          )
          assert fetched == [2], fetched
          assert finished["complete"] is True and finished["resumed"] is True, finished
          assert finished["fetched"] == finished["saved"] == 2, finished
          final = store.get_checkpoint("budget", scope)
          assert final["status"] == "COMPLETE", final
          assert json.loads(final["cursor_value"])["generation"] == generation
          assert collector.verified_checkpoint(final)
          assert store.current_payload_hash("budget", "SIGKILL4255-A") is not None
          assert store.current_payload_hash("budget", "SIGKILL4255-B") is not None
          print("G2B_4_1_260_REAL_POSTGRES_SIGKILL_MID_TRANSACTION_RESUME_OK",{
              "first_status":cp["status"],
              "first_page":cp["page_no"],
              "resume_pages":fetched,
              "final_count":finished["fetched"],
              "generation_preserved":True,
          })
          PY


      - name: Real restart singleton OS lock prevents duplicate collector without waiting
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
          G2B_SERVICE_KEY: ''
          LOFIN_API_KEY: ''
          EDUINFO_API_KEY: ''
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import concurrent.futures
          import fcntl
          import os
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          path = Path(tempfile.gettempdir()) / "g2b_heavy_background_worker.lock"
          with path.open("a+b") as active_worker_lock:
              fcntl.flock(
                  active_worker_lock.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB
              )
              start = time.monotonic()
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  futures = {
                      mode: pool.submit(
                          subprocess.run,
                          [sys.executable, "-B", "-m", "g2b_heavy_worker", mode],
                          capture_output=True,
                          text=True,
                          env=os.environ.copy(),
                          timeout=8,
                      )
                      for mode in ("shopping", "budget")
                  }
                  outcomes = {mode: task.result() for mode, task in futures.items()}
              elapsed = time.monotonic() - start
              assert elapsed < 7, elapsed
              for mode, result in outcomes.items():
                  assert result.returncode == 77, (
                      mode, result.returncode, result.stdout[-600:], result.stderr[-600:]
                  )
                  assert "G2B_HEAVY_WORKER_SLOT_LEASE_HELD" in result.stdout
              fcntl.flock(active_worker_lock.fileno(), fcntl.LOCK_UN)

          print("G2B_4_1_260_REAL_RESTART_DUPLICATE_CHILD_LOCK_OK",{
              "modes": ["shopping","budget"],
              "lock_wait_seconds": round(elapsed,3),
              "exit_code": 77,
              "database_delete_or_api_calls": 0,
          })
          PY
          uv pip install --python .venv/bin/python pytest
          .venv/bin/python -m pytest -q tests/test_g2b_4256_restart_worker_lock.py
          echo G2B_4_1_260_RESTART_GRACE_AND_SINGLETON_OK


      - name: Cross-process PostgreSQL source locks and isolated session watchdog
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python pytest
          .venv/bin/python -m pytest -q tests/test_g2b_4257_cross_process_lease_watchdog.py
          .venv/bin/python - <<'PY'
          import os
          import select
          import subprocess
          import sys
          import textwrap
          import time
          import psycopg
          import g2b_database

          dsn = os.environ["G2B_DATABASE_URL"]
          child_code = textwrap.dedent("""
              import time
              import g2b_database
              with g2b_database.operational_source_cycle_lease('shopping') as ok:
                  assert ok
                  print("G2B_4257_SHOPPING_LEASE_HELD", flush=True)
                  time.sleep(25)
          """)
          env = os.environ.copy()
          env.update({
              "G2B_RUNTIME_ROLE": "LOCAL_COLLECTOR",
              "G2B_ISOLATED_HEAVY_WORKER": "1",
              "G2B_TEST_MODE": "0",
          })
          child = subprocess.Popen(
              [sys.executable,"-B","-u","-c",child_code],
              env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True,
          )
          try:
              readable,_,_ = select.select([child.stdout],[],[],12)
              assert readable, "PG child never acquired source lock"
              assert child.stdout.readline().strip()=="G2B_4257_SHOPPING_LEASE_HELD"
              # The existing transactionless 1+1 data pool stays available,
              # while a second generation cannot overlap the same source.
              with g2b_database.operational_source_cycle_lease("shopping") as ok:
                  assert ok is False
              with g2b_database.operational_source_cycle_lease("budget") as ok:
                  assert ok is True
                  with g2b_database.operational_cycle_lease() as global_ok:
                      assert global_ok is False
              with psycopg.connect(dsn, autocommit=True) as observer:
                  row = observer.execute(
                      "SELECT pid,state,xact_start FROM pg_stat_activity "
                      "WHERE application_name='g2b_v41_operational_lease' "
                      "AND pid<>pg_backend_pid() ORDER BY backend_start DESC LIMIT 1"
                  ).fetchone()
                  assert row and row[1] == "idle" and row[2] is None, row
                  terminated = observer.execute(
                      "SELECT pg_terminate_backend(%s)",(int(row[0]),)
                  ).fetchone()[0]
                  assert terminated
              # Once the owner PG session dies, its isolated watchdog must
              # fail closed as 77, before continuing network/source work.
              stdout,stderr=child.communicate(timeout=15)
              assert child.returncode==77,(child.returncode,stdout[-1000:],stderr[-1000:])
              assert "G2B_ISOLATED_LEASE_SESSION_LOST" in stdout
              with g2b_database.operational_source_cycle_lease("shopping") as ok:
                  assert ok is True
              print("G2B_4_1_260_CROSS_PROCESS_LOST_LEASE_CHILD_EXIT77_OK",{
                  "legacy_mixed_release":"COLD_RESTART_REQUIRED",
                  "same_source_overlap":False,
                  "other_source_independent":True,
                  "child_exit":child.returncode,
              })
          finally:
              if child.poll() is None:
                  child.kill()
                  child.wait(timeout=5)
          PY


      - name: PostgreSQL cold cutover guard refuses legacy active and lost leases without operator proof
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_AUTO_SYNC_DISABLE: '1'
          G2B_V41_FRESH_START: '0'
          G2B_DESTRUCTIVE_RESET_CONFIRM: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_live207
          G2B_BUDGET_SCHEMA: g2b_budget_live207
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python pytest
          .venv/bin/python -m pytest -q tests/test_g2b_4258_cold_cutover_guard.py
          .venv/bin/python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          import psycopg
          import g2b_database

          script = "scripts/g2b_cold_cutover_guard.py"
          def report(attest):
              cmd=[sys.executable, "-B", script]
              if attest: cmd.append("--old-processes-stopped")
              p=subprocess.run(cmd,text=True,capture_output=True,
                               env=os.environ.copy(),timeout=10)
              assert p.returncode in (0,2),(p.returncode,p.stdout,p.stderr)
              import json
              return p.returncode,json.loads(p.stdout)

          # Old and new production global/source namespaces must conflict,
          # regardless of who owns the PostgreSQL backend.
          with g2b_database.operational_source_cycle_lease("shopping") as acquired:
              assert acquired is True
              code,busy=report(True)
              assert code==2 and not busy["cutover_ready"],busy
              assert "g2b_v41_operational_cycle" in busy["pg_advisory_probe_busy"],busy
              assert "g2b_v41_manual_shopping" in busy["pg_advisory_probe_busy"],busy
          code,no_ack=report(False)
          assert code==2 and not no_ack["cutover_ready"]
          assert no_ack["pg_advisory_probe_busy"]==[]
          assert no_ack["old_process_exited_machine_verified"] is False
          code,ready=report(True)
          assert code==0 and ready["cutover_ready"],ready
          assert ready["source_api_calls"]==0 and ready["business_rows_modified"]==0
          assert ready["schema_ddl_performed"] is False

          # Emulate 4.1.238's old idle-in-transaction advisory session.
          # The legacy process may remain alive AFTER PG times it out and
          # releases all locks: therefore no-lock alone must NEVER pass.
          dsn=os.environ["G2B_DATABASE_URL"]
          with psycopg.connect(dsn, autocommit=True) as observer:
              with __import__('contextlib').closing(psycopg.connect(dsn, autocommit=False)) as legacy:
                  legacy.execute("SET idle_in_transaction_session_timeout = 1000")
                  assert legacy.execute(
                      "SELECT pg_try_advisory_lock_shared(hashtext(%s))",
                      ("g2b_v41_operational_cycle",)
                  ).fetchone()[0] is True
                  assert legacy.execute(
                      "SELECT pg_try_advisory_lock(hashtext(%s))",
                      ("g2b_v41_manual_shopping",)
                  ).fetchone()[0] is True
                  c,busy=report(True)
                  assert c==2 and not busy["cutover_ready"]
                  time.sleep(1.6)
                  c,no_ack=report(False)
                  assert c==2 and not no_ack["cutover_ready"]
                  assert no_ack["pg_advisory_probe_busy"] == [], (
                      "old PostgreSQL idle transaction must have lost its lock",
                      no_ack,
                  )
                  assert no_ack["old_process_exited_machine_verified"] is False
          print("G2B_4_1_260_LEGACY_IDLE_TRANSACTION_CUTOVER_HOLD_OK",{
              "active_legacy_refused":True,
              "no_lock_without_old_pid_proof_refused":True,
              "both_reset_flags_disabled":True,
              "no_api_or_business_table_change":True,
          })
          PY


