# verification-trigger: 2026-09-17 budget/completeness remediation + exact source archive
name: g2b-vnext

on:
  push:
    branches:
      - feature/g2b-vnext-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'vnext_*.py'
      - 'lofin_vnext_http.py'
      - 'budget_vnext.py'
      - 'budget_vnext_canary.py'
      - 'shopping_vnext.py'
      - 'bid_vnext.py'
      - 'award_vnext.py'
      - 'award_projection.py'
      - 'contract_vnext.py'
      - 'contract_projection.py'
      - 'projection_store_vnext.py'
      - 'g2b_vnext_pipeline.py'
      - 'g2b_vnext_canary.py'
      - 'historical_vnext.py'
      - 'classification_vnext.py'
      - 'analysis_vnext.py'
      - 'readiness_vnext.py'
      - 'tests/test_*vnext.py'
      - 'tests/test_lofin_vnext_http.py'
      - 'tests/test_award_projection.py'
      - 'tests/test_contract_projection.py'
      - 'tests/test_g2b_vnext_pipeline.py'
      - 'tests/test_g2b_vnext_canary.py'
      - 'tests/test_historical_vnext.py'
      - 'tests/test_classification_vnext.py'
      - 'tests/test_analysis_vnext.py'
      - 'tests/test_readiness_vnext.py'
      - 'tests/test_vnext_http.py'
      - 'tests/test_vnext_paging.py'
      - '.github/workflows/g2b-vnext.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      G2B_DB_PATH: /tmp/g2b-vnext-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile vNext modules
        run: |
          python -m py_compile \
            vnext_schema.py vnext_store.py vnext_http.py vnext_paging.py lofin_vnext_http.py \
            projection_store_vnext.py budget_vnext.py budget_vnext_canary.py shopping_vnext.py \
            bid_vnext.py award_vnext.py award_projection.py contract_vnext.py contract_projection.py \
            g2b_vnext_pipeline.py g2b_vnext_canary.py historical_vnext.py classification_vnext.py \
            analysis_vnext.py readiness_vnext.py
      - name: Run full vNext regression suite
        shell: bash
        run: |
          mkdir -p /tmp/g2b-vnext-evidence
          git rev-parse HEAD > /tmp/g2b-vnext-evidence/head_sha.txt
          git status --porcelain=v1 > /tmp/g2b-vnext-evidence/git_status.txt
          git archive --format=zip --output=/tmp/g2b-vnext-evidence/AI-SPECE-tested-source.zip HEAD
          set -o pipefail
          python -m pytest -q \
            tests/test_budget_vnext.py \
            tests/test_budget_vnext_canary.py \
            tests/test_lofin_vnext_http.py \
            tests/test_shopping_vnext.py \
            tests/test_bid_vnext.py \
            tests/test_award_vnext.py \
            tests/test_award_projection.py \
            tests/test_contract_vnext.py \
            tests/test_contract_projection.py \
            tests/test_projection_store_vnext.py \
            tests/test_g2b_vnext_pipeline.py \
            tests/test_g2b_vnext_canary.py \
            tests/test_historical_vnext.py \
            tests/test_classification_vnext.py \
            tests/test_analysis_vnext.py \
            tests/test_readiness_vnext.py \
            tests/test_vnext_http.py \
            tests/test_vnext_paging.py \
            tests/test_store_vnext.py \
            --junitxml=/tmp/g2b-vnext-evidence/junit.xml \
            2>&1 | tee /tmp/g2b-vnext-evidence/pytest.log
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-vnext-regression-evidence
          path: /tmp/g2b-vnext-evidence
          if-no-files-found: warn
          retention-days: 14
