name: g2b-vnext
on:
  push:
    branches: [main]
    paths: ['*.py', 'tests/**', 'scripts/g2b_*.py', '.github/workflows/g2b-vnext*.yml']
  pull_request:
    paths: ['*.py', 'tests/**', 'scripts/g2b_*.py', '.github/workflows/g2b-vnext*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g2b_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g2b_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Real PostgreSQL schema and resume contract
        env:
          G2B_TEST_MODE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_BUDGET_SCHEMA: g2b_budget_ci
        run: |
          python - <<'PY'
          from sqlalchemy import inspect, text

          import budget_pg_collection
          import budget_pg_store

          budget_pg_store.reset_engine_cache()
          assert budget_pg_store.postgres_ready(), budget_pg_store.postgres_last_error_code()
          engine, tables = budget_pg_store._engine_and_tables()
          assert engine.dialect.name == "postgresql"

          saved = budget_pg_store.preserve_observation(
              "budget",
              "ci-direct",
              {"fyr": "2026", "dbiz_cd": "CI-DIRECT", "amount": 100},
              source_system="CI",
              source_operation="CI_DIRECT",
              source_date="2026-10-01",
          )
          assert saved["sha256"]
          assert budget_pg_store.current_payload_hash(
              "budget", "ci-direct"
          ) == saved["sha256"]

          calls = []
          def fetch(page, size):
              calls.append(page)
              return ({
                  1: [{"fyr": "2026", "dbiz_cd": "CI-A", "amount": 100}],
                  2: [{"fyr": "2026", "dbiz_cd": "CI-B", "amount": 200}],
              }[page], 2)

          common = dict(
              dataset="budget",
              scope="ci:resume",
              range_start="2026",
              range_end="2026-10-01",
              page_size=1,
              fetch=fetch,
              identity=lambda row: row["dbiz_cd"],
              source_system="CI",
              source_operation="CI_QWGJK",
              source_date=lambda row: "2026-10-01",
              checkpoint_contract="CI_V1",
          )
          partial = budget_pg_collection.collect_pages(
              **common, max_pages=1, resume=False
          )
          assert partial["status"] == "RUNNING", partial
          assert partial["fetched"] == 1, partial

          budget_pg_store.reset_engine_cache()
          resumed = budget_pg_collection.collect_pages(
              **common, max_pages=4, resume=True
          )
          assert resumed["complete"] is True, resumed
          assert resumed["fetched"] == 2, resumed
          assert calls == [1, 2], calls

          engine, tables = budget_pg_store._engine_and_tables()
          with engine.connect().execution_options(
              isolation_level="AUTOCOMMIT"
          ) as conn:
              conn.execute(text(
                  'DROP INDEX IF EXISTS '
                  '"g2b_budget_ci"."ix_budget_checkpoint_updated"'
              ))
          budget_pg_store.reset_engine_cache()
          assert budget_pg_store.postgres_ready(), budget_pg_store.postgres_last_error_code()
          engine, _ = budget_pg_store._engine_and_tables()
          indexes = {
              row["name"]
              for row in inspect(engine).get_indexes(
                  "budget_collection_checkpoints",
                  schema="g2b_budget_ci",
              )
          }
          assert "ix_budget_checkpoint_updated" in indexes, indexes
          current_saved = budget_pg_store.preserve_observation(
              "budget",
              "ci-history-safety",
              {
                  "fyr": "2026", "exe_ymd": "20261002",
                  "wa_laf_cd": "4100000", "laf_cd": "4111000",
                  "dept_cd": "CI-H", "dbiz_cd": "CI-HISTORY",
                  "dbiz_nm": "LED 현재 예산", "acnt_dv_cd": "A1",
                  "bdg_cash_amt": 200, "ep_amt": 20,
              },
              source_system="CI", source_operation="CI_CURRENT",
              source_date="2026-10-02",
          )
          assert current_saved["current_advanced"] is True
          historical_saved = budget_pg_store.preserve_observation(
              "budget",
              "ci-history-safety",
              {
                  "fyr": "2026", "exe_ymd": "20260101",
                  "wa_laf_cd": "4100000", "laf_cd": "4111000",
                  "dept_cd": "CI-H", "dbiz_cd": "CI-HISTORY",
                  "dbiz_nm": "LED 과거 예산", "acnt_dv_cd": "A1",
                  "bdg_cash_amt": 100, "ep_amt": 0,
              },
              source_system="CI", source_operation="CI_HISTORY",
              source_date="2026-01-01",
              advance_current=False,
          )
          assert historical_saved["current_advanced"] is False
          current_rows = [
              row for row in budget_pg_store.current_rows(["budget"])
              if row["record_key"] == "ci-history-safety"
          ]
          assert len(current_rows) == 1, current_rows
          assert current_rows[0]["payload"]["dbiz_nm"] == "LED 현재 예산", current_rows
          assert len(budget_pg_store.revision_rows(
              "budget", "ci-history-safety"
          )) == 2
          print("G2B_REAL_POSTGRES_BUDGET_HISTORY_SAFE_OK")
          print("G2B_REAL_POSTGRES_CONTRACT_OK")
          PY
      - name: Real PostgreSQL shopping collection contract
        env:
          G2B_TEST_MODE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_V41_FRESH_START: '1'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_shopping_ci
          G2B_BUDGET_SCHEMA: g2b_budget_shopping_ci
          G2B_VNEXT_API_DAILY_LIMIT: '10'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from contextlib import contextmanager
          from zoneinfo import ZoneInfo

          import db
          import procurement_read_vnext
          import shopping_recent_vnext
          import shopping_store_v41
          import shopping_vnext
          import v41_fresh_start
          import vnext_clean_db
          import vnext_collection
          import vnext_http
          import vnext_source_guard
          import vnext_store

          v41_fresh_start.prepare_v41_storage()
          vnext_clean_db.ensure_clean_schema()

          with db.connect() as conn:
              seeds = [
                  ("vnext_api_calls_date", "1900-01-01"),
                  ("vnext_api_calls_total", "9"),
                  ("vnext_api_calls_shopping_count", "7"),
                  ("vnext_api_calls_contract_count", "3"),
                  ("api_calls_shop_count", "17"),
              ]
              conn.executemany(
                  "INSERT INTO app_settings(key,value) VALUES(?,?) "
                  "ON CONFLICT(key) DO UPDATE SET value=excluded.value",
                  seeds,
              )

          assert vnext_http._quota_take("shopping") == (1, 10)
          with db.connect() as conn:
              legacy = conn.execute(
                  "SELECT value FROM app_settings WHERE key='api_calls_shop_count'"
              ).fetchone()
              other = conn.execute(
                  "SELECT value FROM app_settings "
                  "WHERE key='vnext_api_calls_contract_count'"
              ).fetchone()
          assert legacy["value"] == "17"
          assert other["value"] == "0"

          today = dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          day = dt.date(2026, 9, 1)
          assert day < today
          assert shopping_recent_vnext.BOOTSTRAP_START_DATE == day
          assert shopping_vnext.shopping_scope_v4.validate_start_date(day) == day

          def synthetic_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == day.isoformat()
              assert str(end_date) == day.isoformat()
              payload = [
                  {
                      "dlvrReqNo": "CI-REQ-1",
                      "dlvrReqChgOrd": "0",
                      "prdctSno": "1",
                      "dlvrReqRcptDate": "20260901",
                      "dtilPrdctClsfcNo": "3911151502",
                      "dtilPrdctClsfcNoNm": "LED 가로등기구",
                      "prdctIdntNo": "CI-ITEM-1",
                      "prdctNm": "LED 가로등기구",
                      "dminsttNm": "인천광역시 옹진군",
                      "dminsttRgnNm": "인천광역시 미추홀구",
                      "cntrctCorpNm": "CI 공급사",
                      "prdctQty": "1",
                      "prdctUprc": "1000",
                  },
                  {
                      "dlvrReqNo": "CI-REQ-OTHER",
                      "dlvrReqChgOrd": "0",
                      "prdctSno": "1",
                      "dlvrReqRcptDate": "20260901",
                      "dtilPrdctClsfcNo": "9999999999",
                      "dtilPrdctClsfcNoNm": "일반 사무용품",
                      "prdctIdntNo": "CI-ITEM-OTHER",
                      "prdctNm": "일반 사무용품",
                      "dminsttNm": "인천광역시 옹진군",
                      "cntrctCorpNm": "CI 비대상 공급사",
                  },
              ]
              return payload, 2

          # This contract exercises the real PostgreSQL checkpoint/normalized-store
          # path. Transport-attestation has separate dedicated regressions.
          vnext_source_guard.require_attested_transport_result = (
              lambda before, result, **kwargs: result
          )
          shopping_vnext.fetch_page = synthetic_fetch
          result = shopping_recent_vnext.collect_forward(
              start_date=day.isoformat(),
              latest_date=day.isoformat(),
              max_days=1,
              page_size=2,
              max_pages_per_day=2,
              request_budget_per_day=2,
          )
          assert result["status"] == "COMPLETE", result
          assert result["results"][0]["fetched"] == 2, result
          assert result["results"][0]["saved"] == 1, result
          assert shopping_store_v41.count()["records"] == 1
          first_scope = f"{day.isoformat()}:{day.isoformat()}"
          first_cp = vnext_store.get_checkpoint("shopping_delivery", first_scope)
          assert vnext_collection.verified_compact_completion(first_cp), first_cp
          with db.connect() as conn:
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_pages
                     WHERE dataset=? AND scope_key=?""",
                  ("shopping_delivery", first_scope),
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_items
                     WHERE dataset=? AND scope_key=?""",
                  ("shopping_delivery", first_scope),
              ).fetchone()[0] == 0

          # A completed source day may receive a late change order. Once baseline
          # catch-up is complete, recheck the bounded recent window exactly once
          # per KST day and upsert the newly visible change order.
          recheck_calls = []
          def late_change_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == day.isoformat()
              assert str(end_date) == day.isoformat()
              assert int(page) == 1
              assert rows == 3
              recheck_calls.append(int(page))
              return [
                  {
                      "dlvrReqNo": "CI-REQ-1",
                      "dlvrReqChgOrd": "0",
                      "prdctSno": "1",
                      "dlvrReqRcptDate": "20260901",
                      "dtilPrdctClsfcNo": "3911151502",
                      "prdctNm": "LED 가로등기구",
                      "dminsttNm": "인천광역시 옹진군",
                      "dminsttRgnNm": "인천광역시 미추홀구",
                      "cntrctCorpNm": "CI 공급사",
                  },
                  {
                      "dlvrReqNo": "CI-REQ-1",
                      "dlvrReqChgOrd": "1",
                      "prdctSno": "1",
                      "dlvrReqRcptDate": "20260901",
                      "dtilPrdctClsfcNo": "3911151502",
                      "prdctNm": "LED 가로등기구 변경",
                      "dminsttNm": "인천광역시 옹진군",
                      "dminsttRgnNm": "인천광역시 미추홀구",
                      "cntrctCorpNm": "CI 변경 공급사",
                  },
                  {
                      "dlvrReqNo": "CI-REQ-OTHER",
                      "dlvrReqChgOrd": "0",
                      "prdctSno": "1",
                      "dlvrReqRcptDate": "20260901",
                      "dtilPrdctClsfcNo": "9999999999",
                      "prdctNm": "일반 사무용품",
                      "cntrctCorpNm": "CI 비대상 공급사",
                  },
              ], 3

          shopping_vnext.fetch_page = late_change_fetch
          refreshed = shopping_recent_vnext.collect_forward(
              start_date=day.isoformat(),
              latest_date=day.isoformat(),
              max_days=1,
              page_size=3,
              max_pages_per_day=2,
              request_budget_per_day=2,
              recheck_days=1,
          )
          assert refreshed["status"] == "COMPLETE", refreshed
          assert refreshed["results"] == [], refreshed
          assert len(refreshed["rechecks"]) == 1, refreshed
          assert refreshed["rechecks"][0]["saved"] == 2, refreshed
          assert recheck_calls == [1], recheck_calls
          assert shopping_store_v41.count()["records"] == 2

          shopping_vnext.fetch_page = (
              lambda *args, **kwargs: (_ for _ in ()).throw(
                  AssertionError("same-KST-day recheck must not call source twice")
              )
          )
          same_day = shopping_recent_vnext.collect_forward(
              start_date=day.isoformat(),
              latest_date=day.isoformat(),
              max_days=1,
              page_size=3,
              max_pages_per_day=2,
              request_budget_per_day=2,
              recheck_days=1,
          )
          assert same_day["status"] == "COMPLETE", same_day
          assert same_day["rechecks"] == [], same_day

          # Prove exact page resume on the real PostgreSQL checkpoint path.
          resume_day = dt.date(2026, 9, 2)
          resume_calls = []
          fail_page_two = {"value": True}

          def interrupted_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == resume_day.isoformat()
              assert str(end_date) == resume_day.isoformat()
              assert rows == 1
              resume_calls.append(int(page))
              if int(page) == 2 and fail_page_two["value"]:
                  fail_page_two["value"] = False
                  raise vnext_http.VNextQuotaReached(
                      "22", "synthetic CI quota interruption"
                  )
              suffix = "A" if int(page) == 1 else "B"
              return [{
                  "dlvrReqNo": f"CI-RESUME-{suffix}",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260902",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "LED 보안등기구",
                  "cntrctCorpNm": "CI 재개 공급사",
              }], 2

          shopping_vnext.fetch_page = interrupted_fetch
          try:
              shopping_recent_vnext.collect_forward(
                  start_date=resume_day.isoformat(),
                  latest_date=resume_day.isoformat(),
                  max_days=1,
                  page_size=1,
                  max_pages_per_day=2,
                  request_budget_per_day=2,
              )
              raise AssertionError("page-2 quota interruption was not raised")
          except vnext_http.VNextQuotaReached:
              pass

          resume_scope = f"{resume_day.isoformat()}:{resume_day.isoformat()}"
          failed_cp = vnext_store.get_checkpoint(
              "shopping_delivery", resume_scope
          )
          assert failed_cp["status"] == "FAILED", failed_cp
          assert int(failed_cp["page_no"]) == 2, failed_cp
          assert int(failed_cp["fetched_count"]) == 1, failed_cp
          assert int(failed_cp["saved_count"]) == 1, failed_cp

          resumed = shopping_recent_vnext.collect_forward(
              start_date=resume_day.isoformat(),
              latest_date=resume_day.isoformat(),
              max_days=1,
              page_size=1,
              max_pages_per_day=2,
              request_budget_per_day=2,
          )
          assert resumed["status"] == "COMPLETE", resumed
          assert resumed["results"][0]["resumed"] is True, resumed
          assert resume_calls == [1, 2, 2], resume_calls

          complete_cp = vnext_store.get_checkpoint(
              "shopping_delivery", resume_scope
          )
          assert complete_cp["status"] == "COMPLETE", complete_cp
          assert int(complete_cp["page_no"]) == 3, complete_cp
          assert int(complete_cp["fetched_count"]) == 2, complete_cp
          assert int(complete_cp["saved_count"]) == 2, complete_cp
          assert vnext_collection.verified_compact_completion(complete_cp), complete_cp
          assert shopping_store_v41.count()["records"] == 4
          with db.connect() as conn:
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_pages
                     WHERE dataset=? AND scope_key=?""",
                  ("shopping_delivery", resume_scope),
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_items
                     WHERE dataset=? AND scope_key=?""",
                  ("shopping_delivery", resume_scope),
              ).fetchone()[0] == 0

          shopping_vnext.fetch_page = (
              lambda *args, **kwargs: (_ for _ in ()).throw(
                  AssertionError("completed day must not refetch source")
              )
          )
          repeated = shopping_recent_vnext.collect_forward(
              start_date=resume_day.isoformat(),
              latest_date=resume_day.isoformat(),
              max_days=1,
              page_size=1,
              max_pages_per_day=2,
              request_budget_per_day=2,
          )
          assert repeated["status"] == "COMPLETE", repeated
          assert repeated["results"] == [], repeated

          # Real-time source total growth may occur between pages. It must extend
          # the same generation rather than forcing an endless replay.
          growth_day = dt.date(2026, 9, 3)
          growth_calls = []

          def growth_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == growth_day.isoformat()
              assert str(end_date) == growth_day.isoformat()
              assert rows == 1
              growth_calls.append(int(page))
              totals = {1: 2, 2: 3, 3: 3}
              return [{
                  "dlvrReqNo": f"CI-GROW-{page}",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260903",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "LED 가로등기구",
                  "cntrctCorpNm": "CI 증가 공급사",
              }], totals[int(page)]

          shopping_vnext.fetch_page = growth_fetch
          grown = shopping_recent_vnext.collect_forward(
              start_date=growth_day.isoformat(),
              latest_date=growth_day.isoformat(),
              max_days=1,
              page_size=1,
              max_pages_per_day=3,
              request_budget_per_day=3,
          )
          assert grown["status"] == "COMPLETE", grown
          assert grown["results"][0]["fetched"] == 3, grown
          assert grown["results"][0]["source_total"] == 3, grown
          assert growth_calls == [1, 2, 3], growth_calls
          growth_scope = f"{growth_day.isoformat()}:{growth_day.isoformat()}"
          growth_cp = vnext_store.get_checkpoint(
              "shopping_delivery", growth_scope
          )
          assert vnext_collection.verified_compact_completion(growth_cp), growth_cp
          assert int(growth_cp["source_total"]) == 3, growth_cp

          # A decreasing total invalidates the current page map. The unstable page
          # must not leak normalized rows, and the next cycle must replay page 1
          # in a fresh generation before compacting.
          drift_day = dt.date(2026, 9, 4)
          drift_calls = []

          def drifting_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == drift_day.isoformat()
              assert str(end_date) == drift_day.isoformat()
              assert rows == 1
              drift_calls.append(int(page))
              req = "CI-DROP-A" if int(page) == 1 else "CI-DROP-ROGUE"
              total = 3 if int(page) == 1 else 2
              return [{
                  "dlvrReqNo": req,
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260904",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "LED 보안등기구",
                  "cntrctCorpNm": "CI 변동 공급사",
              }], total

          shopping_vnext.fetch_page = drifting_fetch
          drifted = shopping_recent_vnext.collect_forward(
              start_date=drift_day.isoformat(),
              latest_date=drift_day.isoformat(),
              max_days=1,
              page_size=1,
              max_pages_per_day=3,
              request_budget_per_day=3,
          )
          assert drifted["status"] == "PARTIAL", drifted
          assert drifted["results"][0]["reason"] == "SOURCE_TOTAL_DECREASED", drifted
          assert drift_calls == [1, 2], drift_calls
          drift_scope = f"{drift_day.isoformat()}:{drift_day.isoformat()}"
          drift_cp = vnext_store.get_checkpoint("shopping_delivery", drift_scope)
          drift_meta = json.loads(drift_cp["cursor_value"])
          assert drift_cp["status"] == "INCOMPLETE", drift_cp
          with db.connect() as conn:
              assert conn.execute(
                  "SELECT COUNT(*) FROM shopping_records "
                  "WHERE delivery_req_no='CI-DROP-ROGUE'"
              ).fetchone()[0] == 0

          replay_calls = []
          def stable_after_drift(start_date, end_date, page=1, rows=999):
              assert str(start_date) == drift_day.isoformat()
              assert str(end_date) == drift_day.isoformat()
              assert rows == 1
              replay_calls.append(int(page))
              req = "CI-DROP-A" if int(page) == 1 else "CI-DROP-B"
              return [{
                  "dlvrReqNo": req,
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260904",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "LED 보안등기구",
                  "cntrctCorpNm": "CI 변동 공급사",
              }], 2

          shopping_vnext.fetch_page = stable_after_drift
          replayed = shopping_recent_vnext.collect_forward(
              start_date=drift_day.isoformat(),
              latest_date=drift_day.isoformat(),
              max_days=1,
              page_size=1,
              max_pages_per_day=3,
              request_budget_per_day=3,
          )
          assert replayed["status"] == "COMPLETE", replayed
          assert replay_calls == [1, 2], replay_calls
          replay_cp = vnext_store.get_checkpoint("shopping_delivery", drift_scope)
          replay_meta = json.loads(replay_cp["cursor_value"])
          assert replay_meta["generation"] != drift_meta["generation"], (
              drift_meta, replay_meta
          )
          assert vnext_collection.verified_compact_completion(replay_cp), replay_cp
          with db.connect() as conn:
              assert conn.execute(
                  "SELECT COUNT(*) FROM shopping_records "
                  "WHERE delivery_req_no='CI-DROP-ROGUE'"
              ).fetchone()[0] == 0
              assert conn.execute(
                  "SELECT COUNT(*) FROM shopping_records "
                  "WHERE delivery_req_no='CI-DROP-B'"
              ).fetchone()[0] == 1

          # Once baseline and the recent window are complete, rotate two older
          # COMPLETE dates per KST day. The recent dates are pre-marked as checked
          # so this exercise isolates only the long-tail path.
          db.set_setting(
              shopping_recent_vnext.RECHECK_STATE_KEY,
              json.dumps({
                  "run_date": today.isoformat(),
                  "dates": [
                      growth_day.isoformat(),
                      drift_day.isoformat(),
                  ],
              }),
          )
          longtail_calls = []

          def longtail_fetch(start_date, end_date, page=1, rows=999):
              assert str(start_date) == str(end_date)
              assert int(page) == 1
              assert rows == 3
              iso = str(start_date)
              longtail_calls.append(iso)
              if iso == day.isoformat():
                  return [
                      {
                          "dlvrReqNo": "CI-REQ-1",
                          "dlvrReqChgOrd": "0",
                          "prdctSno": "1",
                          "dlvrReqRcptDate": "20260901",
                          "dtilPrdctClsfcNo": "3911151502",
                          "prdctNm": "LED 가로등기구",
                          "dminsttNm": "인천광역시 옹진군",
                          "dminsttRgnNm": "인천광역시 미추홀구",
                          "cntrctCorpNm": "CI 공급사",
                      },
                      {
                          "dlvrReqNo": "CI-REQ-1",
                          "dlvrReqChgOrd": "1",
                          "prdctSno": "1",
                          "dlvrReqRcptDate": "20260901",
                          "dtilPrdctClsfcNo": "3911151502",
                          "prdctNm": "LED 가로등기구 변경",
                          "dminsttNm": "인천광역시 옹진군",
                          "dminsttRgnNm": "인천광역시 미추홀구",
                          "cntrctCorpNm": "CI 변경 공급사",
                      },
                      {
                          "dlvrReqNo": "CI-REQ-OTHER",
                          "dlvrReqChgOrd": "0",
                          "prdctSno": "1",
                          "dlvrReqRcptDate": "20260901",
                          "dtilPrdctClsfcNo": "9999999999",
                          "prdctNm": "일반 사무용품",
                          "cntrctCorpNm": "CI 비대상 공급사",
                      },
                  ], 3
              if iso == resume_day.isoformat():
                  return [
                      {
                          "dlvrReqNo": "CI-RESUME-A",
                          "dlvrReqChgOrd": "0",
                          "prdctSno": "1",
                          "dlvrReqRcptDate": "20260902",
                          "dtilPrdctClsfcNo": "3911160302",
                          "prdctNm": "LED 보안등기구",
                          "cntrctCorpNm": "CI 재개 공급사",
                      },
                      {
                          "dlvrReqNo": "CI-RESUME-B",
                          "dlvrReqChgOrd": "0",
                          "prdctSno": "1",
                          "dlvrReqRcptDate": "20260902",
                          "dtilPrdctClsfcNo": "3911160302",
                          "prdctNm": "LED 보안등기구",
                          "cntrctCorpNm": "CI 재개 공급사",
                      },
                  ], 2
              raise AssertionError(f"unexpected long-tail date {iso}")

          shopping_vnext.fetch_page = longtail_fetch
          longtail = shopping_recent_vnext.collect_forward(
              start_date=day.isoformat(),
              latest_date=drift_day.isoformat(),
              max_days=4,
              page_size=3,
              max_pages_per_day=2,
              request_budget_per_day=2,
              recheck_days=2,
              longtail_recheck_days_per_run=2,
          )
          assert longtail["status"] == "COMPLETE", longtail
          assert [row["date"] for row in longtail["longtail_rechecks"]] == [
              day.isoformat(),
              resume_day.isoformat(),
          ], longtail
          assert longtail_calls == [
              day.isoformat(),
              resume_day.isoformat(),
          ], longtail_calls
          longtail_state = json.loads(
              db.get_setting(
                  shopping_recent_vnext.LONGTAIL_RECHECK_STATE_KEY,
                  "{}",
              )
          )
          assert longtail_state["run_date"] == today.isoformat(), longtail_state
          assert longtail_state["dates"] == [
              day.isoformat(),
              resume_day.isoformat(),
          ], longtail_state

          shopping_vnext.fetch_page = (
              lambda *args, **kwargs: (_ for _ in ()).throw(
                  AssertionError("same-KST-day long-tail must not call source twice")
              )
          )
          longtail_same_day = shopping_recent_vnext.collect_forward(
              start_date=day.isoformat(),
              latest_date=drift_day.isoformat(),
              max_days=4,
              page_size=3,
              max_pages_per_day=2,
              request_budget_per_day=2,
              recheck_days=2,
              longtail_recheck_days_per_run=2,
          )
          assert longtail_same_day["status"] == "COMPLETE", longtail_same_day
          assert longtail_same_day["longtail_rechecks"] == [], longtail_same_day

          # Reconcile one fully rechecked source day without deleting history.
          # Missing rows and a same-identity non-target transition become inactive;
          # the surviving latest change remains active in the business read model.
          reconcile_day = dt.date(2026, 9, 5)
          reconcile_initial = [
              {
                  "dlvrReqNo": "CI-REC-MISSING",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "CI Reconcile Missing",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
              {
                  "dlvrReqNo": "CI-REC-SCOPE",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "CI Reconcile Scope",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
              {
                  "dlvrReqNo": "CI-REC-HISTORY",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "CI Reconcile Old Change",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
              {
                  "dlvrReqNo": "CI-REC-HISTORY",
                  "dlvrReqChgOrd": "1",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "CI Reconcile Active Change",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
          ]
          shopping_vnext.fetch_page = (
              lambda *args, **kwargs: (reconcile_initial, 4)
          )
          reconcile_first = shopping_vnext.collect_all(
              reconcile_day.isoformat(),
              reconcile_day.isoformat(),
              page_size=4,
              max_pages=1,
              resume=False,
              storage_prepared=True,
          )
          assert reconcile_first["complete"] is True, reconcile_first
          assert reconcile_first["reconcile"]["deactivated"] == 0, reconcile_first

          reconcile_refresh = [
              {
                  "dlvrReqNo": "CI-REC-SCOPE",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "9999999999",
                  "prdctNm": "CI Reconcile Now Outside Scope",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
              {
                  "dlvrReqNo": "CI-REC-HISTORY",
                  "dlvrReqChgOrd": "1",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20260905",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "CI Reconcile Active Change",
                  "cntrctCorpNm": "CI reconcile vendor",
              },
          ]
          shopping_vnext.fetch_page = (
              lambda *args, **kwargs: (reconcile_refresh, 2)
          )
          reconcile_second = shopping_vnext.collect_all(
              reconcile_day.isoformat(),
              reconcile_day.isoformat(),
              page_size=2,
              max_pages=1,
              resume=False,
              storage_prepared=True,
          )
          assert reconcile_second["complete"] is True, reconcile_second
          assert reconcile_second["saved"] == 1, reconcile_second
          assert reconcile_second["reconcile"]["deactivated"] == 3, reconcile_second

          with db.connect() as conn:
              rec_rows = conn.execute(
                  """SELECT delivery_req_no,delivery_change_order,
                            is_active,inactive_reason
                     FROM shopping_records
                     WHERE source_date=?
                       AND delivery_req_no LIKE ?
                     ORDER BY delivery_req_no,delivery_change_order""",
                  ("2026-09-05", "CI-REC-%"),
              ).fetchall()
          assert len(rec_rows) == 4, rec_rows
          rec_state = {
              (row["delivery_req_no"], row["delivery_change_order"]):
              (int(row["is_active"]), row["inactive_reason"])
              for row in rec_rows
          }
          assert rec_state[("CI-REC-MISSING", "0")] == (
              0, "MISSING_FROM_COMPLETE_SOURCE"
          ), rec_state
          assert rec_state[("CI-REC-SCOPE", "0")] == (
              0, "OUTSIDE_TARGET_SCOPE"
          ), rec_state
          assert rec_state[("CI-REC-HISTORY", "0")] == (
              0, "MISSING_FROM_COMPLETE_SOURCE"
          ), rec_state
          assert rec_state[("CI-REC-HISTORY", "1")] == (1, ""), rec_state

          active_rec = [
              row for row in procurement_read_vnext.shopping_rows(limit=None)
              if str(row.get("source_date") or "") == reconcile_day.isoformat()
              and str(row.get("delivery_req_no") or "").startswith("CI-REC-")
          ]
          history_rec = [
              row for row in procurement_read_vnext.shopping_rows(
                  limit=None,
                  include_inactive=True,
              )
              if str(row.get("source_date") or "") == reconcile_day.isoformat()
              and str(row.get("delivery_req_no") or "").startswith("CI-REC-")
          ]
          assert len(active_rec) == 1, active_rec
          assert active_rec[0]["delivery_req_no"] == "CI-REC-HISTORY", active_rec
          assert active_rec[0]["delivery_change_order"] == "1", active_rec
          assert len(history_rec) == 4, history_rec
          count_summary = shopping_store_v41.count()
          assert count_summary["records"] == count_summary["history_records"]
          assert (
              count_summary["history_records"]
              == count_summary["active_records"]
              + count_summary["inactive_records"]
          ), count_summary
          assert count_summary["inactive_records"] >= 3, count_summary
          assert count_summary["active_records"] < count_summary["history_records"], (
              count_summary
          )

          # Exercise the exact production search path with a vendor/business name.
          matched = procurement_read_vnext.shopping_rows(
              query="CI 공급사",
              region="",
              limit=10,
          )
          assert len(matched) == 1, matched
          assert matched[0]["vendor_name"] == "CI 공급사", matched
          assert matched[0]["demand_region"] == "인천광역시", matched

          regional = procurement_read_vnext.shopping_rows(
              query="CI 공급사",
              region="인천광역시",
              limit=10,
          )
          assert len(regional) == 1, regional
          assert regional[0]["vendor_name"] == "CI 공급사", regional
          assert regional[0]["demand_region"] == "인천광역시", regional

          # Existing pre-fix rows with district-qualified region strings must
          # remain queryable without destructive resync.
          with db.connect() as conn:
              conn.execute(
                  "UPDATE shopping_records SET demand_region=? WHERE source_key=?",
                  ("인천광역시 미추홀구", regional[0]["source_key"]),
              )
          legacy_regional = procurement_read_vnext.shopping_rows(
              query="CI 공급사",
              region="인천광역시",
              limit=10,
          )
          assert len(legacy_regional) == 1, legacy_regional
          assert legacy_regional[0]["demand_region"] == "인천광역시", legacy_regional

          # Wildcards in user input must be treated as literal text, not SQL syntax.
          assert procurement_read_vnext.shopping_rows(
              query="CI%공급사",
              region="",
              limit=10,
          ) == []

          # Enforce the rolling one-year business-data window in real PostgreSQL.
          # A row exactly on the cutoff remains; all older shopping rows and
          # shopping checkpoints/residual receipts are purged.
          shopping_store_v41.preserve_record(
              "shopping_delivery",
              "CI-RETENTION-KEEP",
              {
                  "dlvrReqNo": "CI-RETENTION-KEEP",
                  "dlvrReqChgOrd": "0",
                  "prdctSno": "1",
                  "dlvrReqRcptDate": "20261003",
                  "dtilPrdctClsfcNo": "3911160302",
                  "prdctNm": "LED retention boundary",
              },
              source_system="G2B",
              source_operation="CI_RETENTION",
              source_date="2026-10-03",
          )
          # Also prove orphan page/item receipts cannot survive just because
          # their checkpoint was already removed by an older interrupted cleanup.
          with db.connect() as conn:
              conn.execute(
                  """INSERT INTO vnext_collection_pages(
                       dataset,scope_key,generation,page_no,page_size,response_hash,
                       item_count,source_total,terminal_reason
                     ) VALUES(?,?,?,?,?,?,?,?,?)""",
                  (
                      "shopping_delivery",
                      "2026-10-02:2026-10-02",
                      "CI-ORPHAN-RETENTION",
                      1,
                      1,
                      "ci-orphan-hash",
                      1,
                      1,
                      "TOTAL_REACHED",
                  ),
              )
              conn.execute(
                  """INSERT INTO vnext_collection_items(
                       dataset,scope_key,generation,source_key,page_no,
                       payload_sha256,stored
                     ) VALUES(?,?,?,?,?,?,?)""",
                  (
                      "shopping_delivery",
                      "2026-10-02:2026-10-02",
                      "CI-ORPHAN-RETENTION",
                      "CI-ORPHAN-KEY",
                      1,
                      "ci-orphan-sha",
                      1,
                  ),
              )
              # Simulate a pre-invariant legacy row that could otherwise evade
              # date-based retention forever.
              conn.execute(
                  """INSERT INTO shopping_records(source_key,source_date)
                     VALUES(?,?)""",
                  ("CI-INVALID-SOURCE-DATE", "2026-99-99"),
              )
              conn.executemany(
                  """INSERT INTO shopping_records(source_key,source_date)
                     VALUES(?,?)""",
                  [
                      (f"CI-RETENTION-BATCH-{index:03d}", "2026-10-02")
                      for index in range(205)
                  ],
              )

          retention = shopping_store_v41.purge_history(
              365,
              batch_size=100,
              now=dt.datetime(
                  2027, 10, 3, 12, 0,
                  tzinfo=dt.timezone(dt.timedelta(hours=9)),
              ),
          )
          assert retention["cutoff_date"] == "2026-10-03", retention
          assert retention["retention_batch_size"] == 100, retention
          assert retention["record_delete_batches"] >= 3, retention
          assert retention["deleted_records"] >= 205, retention
          assert retention["deleted_checkpoints"] > 0, retention
          assert retention["deleted_collection_pages"] > 0, retention
          assert retention["deleted_collection_items"] > 0, retention
          assert retention["invalid_source_dates"] >= 1, retention
          assert retention["deleted_invalid_source_date_records"] >= 1, retention
          with db.connect() as conn:
              assert conn.execute(
                  """SELECT COUNT(*) FROM shopping_records
                     WHERE source_date<?""",
                  ("2026-10-03",),
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM shopping_records
                     WHERE source_key='CI-RETENTION-KEEP'"""
              ).fetchone()[0] == 1
              assert conn.execute(
                  """SELECT COUNT(*) FROM shopping_records
                     WHERE source_key='CI-INVALID-SOURCE-DATE'"""
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM collection_checkpoints
                     WHERE dataset='shopping_delivery'
                       AND range_end<>'' AND range_end<?""",
                  ("2026-10-03",),
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_pages
                     WHERE dataset='shopping_delivery'
                       AND scope_key='2026-10-02:2026-10-02'"""
              ).fetchone()[0] == 0
              assert conn.execute(
                  """SELECT COUNT(*) FROM vnext_collection_items
                     WHERE dataset='shopping_delivery'
                       AND scope_key='2026-10-02:2026-10-02'"""
              ).fetchone()[0] == 0

          # KST is the canonical shopping calendar. UTC timestamps on either
          # side of 00:00 KST and naive KST wall-clock values must resolve to
          # exactly the same retention floor used by the collector.
          assert shopping_store_v41.retention_cutoff_date(
              365,
              now=dt.datetime(
                  2027, 10, 3, 14, 59, 59, tzinfo=dt.timezone.utc
              ),
          ).isoformat() == "2026-10-03"
          assert shopping_store_v41.retention_cutoff_date(
              365,
              now=dt.datetime(
                  2027, 10, 3, 15, 0, 0, tzinfo=dt.timezone.utc
              ),
          ).isoformat() == "2026-10-04"
          assert shopping_store_v41.retention_cutoff_date(
              365,
              now=dt.datetime(2027, 10, 3, 23, 30),
          ).isoformat() == "2026-10-03"
          assert shopping_recent_vnext._retention_start_day(
              "2026-09-01",
              dt.datetime(
                  2027, 10, 3, 23, 30,
                  tzinfo=dt.timezone(dt.timedelta(hours=9)),
              ),
              365,
          ).isoformat() == "2026-10-03"

          # Prove that committed retention batches are restart-safe in real
          # PostgreSQL. Batch 1 commits, batch 2 fails before DELETE, and the next
          # cycle must delete only the remaining 105 rows.
          with db.connect() as conn:
              conn.executemany(
                  """INSERT INTO shopping_records(source_key,source_date)
                     VALUES(?,?)""",
                  [
                      (f"CI-RETENTION-RESUME-{index:03d}", "2026-10-02")
                      for index in range(205)
                  ],
              )

          original_connect = shopping_store_v41.connect
          delete_batches = {"count": 0}

          @contextmanager
          def flaky_retention_connect():
              with original_connect() as conn:
                  class Proxy:
                      def __getattr__(self, name):
                          return getattr(conn, name)

                      def execute(self, sql, params=()):
                          normalized = " ".join(str(sql or "").split())
                          if (
                              normalized.startswith(
                                  "DELETE FROM shopping_records"
                              )
                              and (
                                  "source_date<>'' AND source_date<?"
                                  in normalized
                              )
                          ):
                              delete_batches["count"] += 1
                              if delete_batches["count"] == 2:
                                  raise RuntimeError(
                                      "synthetic retention batch failure"
                                  )
                          return conn.execute(sql, params)

                  yield Proxy()

          shopping_store_v41.connect = flaky_retention_connect
          try:
              try:
                  shopping_store_v41.purge_history(
                      365,
                      batch_size=100,
                      now=dt.datetime(
                          2027, 10, 3, 12, 0,
                          tzinfo=dt.timezone(dt.timedelta(hours=9)),
                      ),
                  )
                  raise AssertionError(
                      "retention failure injection did not fire"
                  )
              except RuntimeError as exc:
                  assert str(exc) == "synthetic retention batch failure"
          finally:
              shopping_store_v41.connect = original_connect

          with db.connect() as conn:
              assert conn.execute(
                  """SELECT COUNT(*) FROM shopping_records
                     WHERE source_key LIKE 'CI-RETENTION-RESUME-%'"""
              ).fetchone()[0] == 105

          resumed_retention = shopping_store_v41.purge_history(
              365,
              batch_size=100,
              now=dt.datetime(
                  2027, 10, 3, 12, 0,
                  tzinfo=dt.timezone(dt.timedelta(hours=9)),
              ),
          )
          assert resumed_retention["expired_records"] == 105, resumed_retention
          assert resumed_retention["deleted_records"] == 105, resumed_retention
          assert resumed_retention["record_delete_batches"] == 2, resumed_retention
          with db.connect() as conn:
              assert conn.execute(
                  """SELECT COUNT(*) FROM shopping_records
                     WHERE source_key LIKE 'CI-RETENTION-RESUME-%'"""
              ).fetchone()[0] == 0

          print("G2B_REAL_POSTGRES_SHOPPING_RETENTION_KST_BOUNDARY_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RETENTION_RESUME_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_COLLECTION_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_COMPACT_COMPLETE_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RESUME_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RECENT_RECHECK_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_LONGTAIL_RECHECK_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RECONCILE_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_ACTIVE_COUNT_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RETENTION_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_ORPHAN_RECEIPT_RETENTION_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_SOURCE_DATE_INVARIANT_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_RETENTION_BATCH_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_LIVE_TOTAL_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_DRIFT_REPLAY_OK")
          print("G2B_REAL_POSTGRES_SHOPPING_SEARCH_OK")
          print("G2B_REAL_POSTGRES_REGION_FILTER_OK")
          PY

      - name: Preprovisioned least-privilege PostgreSQL contract
        env:
          G2B_TEST_MODE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_DATABASE_URL: postgresql://g2b_app:g2b_app_pass@127.0.0.1:5432/g2b_vnext_test
          G2B_BUDGET_SCHEMA: g2b_budget_ci
        run: |
          python - <<'PY'
          import psycopg

          admin = psycopg.connect(
              "postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test",
              autocommit=True,
          )
          with admin.cursor() as cur:
              cur.execute("DROP ROLE IF EXISTS g2b_app")
              cur.execute("CREATE ROLE g2b_app LOGIN PASSWORD 'g2b_app_pass'")
              cur.execute("GRANT CONNECT ON DATABASE g2b_vnext_test TO g2b_app")
              cur.execute("REVOKE CREATE ON SCHEMA g2b_budget_ci FROM PUBLIC")
              cur.execute("GRANT USAGE ON SCHEMA g2b_budget_ci TO g2b_app")
              cur.execute(
                  "GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES "
                  "IN SCHEMA g2b_budget_ci TO g2b_app"
              )
          admin.close()

          import budget_pg_store
          import g2b_database

          budget_pg_store.reset_engine_cache()
          g2b_database.reset_engine_cache()
          assert budget_pg_store.postgres_ready(), (
              budget_pg_store.postgres_last_error_code()
          )
          saved = budget_pg_store.preserve_observation(
              "budget",
              "ci-least-priv",
              {"fyr": "2026", "dbiz_cd": "CI-LEAST", "amount": 300},
              source_system="CI",
              source_operation="CI_LEAST_PRIV",
              source_date="2026-10-01",
          )
          assert saved["sha256"]
          budget_pg_store.save_checkpoint(
              "budget",
              "ci:least-priv",
              range_start="2026",
              range_end="2026-10-01",
              page_no=1,
              page_size=1000,
              source_total=0,
              fetched_count=0,
              saved_count=0,
              status="RUNNING",
          )
          cp = budget_pg_store.get_checkpoint("budget", "ci:least-priv")
          assert cp["status"] == "RUNNING", cp

          # PostgreSQL advisory locks are part of the minimum application-role
          # contract. Exercise the same source-neutral canonical-DB lease used by
          # the production collector. A second exclusive connection must fail fast
          # while the first operational cycle lease is held.
          with g2b_database.operational_cycle_lease() as first_lease:
              assert first_lease is True
              with g2b_database.operational_cycle_lease() as second_lease:
                  assert second_lease is False
          with g2b_database.operational_cycle_lease() as reacquired:
              assert reacquired is True

          # Manual shopping and budget use a shared global gate so they may run
          # together, while the automatic all-source cycle uses the same key in
          # exclusive mode and must be blocked until both manual gates are gone.
          global_name = "g2b_v41_operational_cycle"
          with g2b_database.operational_cycle_lease(
              global_name, shared=True
          ) as shopping_shared:
              assert shopping_shared is True
              with g2b_database.operational_cycle_lease(
                  global_name, shared=True
              ) as budget_shared:
                  assert budget_shared is True
                  with g2b_database.operational_cycle_lease(
                      global_name, shared=False
                  ) as automatic_exclusive:
                      assert automatic_exclusive is False

                  # Different source-specific exclusive keys do not conflict.
                  with g2b_database.operational_cycle_lease(
                      "g2b_v41_manual_shopping"
                  ) as shopping_source:
                      assert shopping_source is True
                      with g2b_database.operational_cycle_lease(
                          "g2b_v41_manual_budget"
                      ) as budget_source:
                          assert budget_source is True

          with g2b_database.operational_cycle_lease(
              global_name, shared=False
          ) as automatic_after_manual:
              assert automatic_after_manual is True
              with g2b_database.operational_cycle_lease(
                  global_name, shared=True
              ) as manual_during_auto:
                  assert manual_during_auto is False

          print("G2B_POSTGRES_LEAST_PRIVILEGE_OK")
          print("G2B_SOURCE_NEUTRAL_OPERATIONAL_PROCESS_LEASE_OK")
          print("G2B_SOURCE_NEUTRAL_SHARED_EXCLUSIVE_SOURCE_LEASE_OK")
          PY

      - name: Canary page 1 then automatic resume page 2
        env:
          G2B_TEST_MODE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_DB_PATH: /app/user_data/g2b-vnext-resume.sqlite3
          G2B_DATABASE_URL: postgresql://g2b_app:g2b_app_pass@127.0.0.1:5432/g2b_vnext_test
          G2B_BUDGET_SCHEMA: g2b_budget_ci
        run: |
          set -euo pipefail
          sudo mkdir -p /app/user_data
          sudo chown "$(id -u):$(id -g)" /app/user_data
          rm -f /app/user_data/g2b-vnext-resume.sqlite3

          # Process 1: the deployment canary is hard-capped to page 1.
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import json
          from contextlib import nullcontext
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import budget_pg_store
          import budget_vnext
          import lofin_vnext_http
          import vnext_source_guard

          today = dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          stamp = today.isoformat()
          stamp8 = today.strftime("%Y%m%d")

          # This is a source-free contract test: synthetic rows are fed through the
          # exact deployment-canary collector and real PostgreSQL checkpoint path.
          def synthetic_fetch(year, snapshot, keyword, *, page, size, **kwargs):
              assert int(year) == today.year
              assert str(snapshot) == stamp
              assert int(size) == 1000
              assert int(page) == 1, f"canary unexpectedly requested page {page}"
              rows = [
                  {
                      "fyr": str(today.year),
                      "exe_ymd": stamp8,
                      "wa_laf_cd": "4100000",
                      "laf_cd": "4111000",
                      "dept_cd": "CI-D1",
                      "dbiz_cd": f"CI-RESUME-{index:04d}",
                      "dbiz_nm": f"CI 예산 사업 {index:04d}",
                      "acnt_dv_cd": "A1",
                      "bdg_cash_amt": "1000",
                      "ep_amt": "100",
                  }
                  for index in range(1000)
              ]
              return rows, 1500, "INFO-000", ""

          budget_vnext.fetch_budget_page = synthetic_fetch
          budget_vnext.next_historical_snapshot_date = lambda **kwargs: None
          budget_vnext.current_source_request_context = lambda: None
          vnext_source_guard.current_source_request_context = lambda: None
          vnext_source_guard.operational_budget_source_context = (
              lambda **kwargs: nullcontext()
          )
          lofin_vnext_http.get_lofin_key = lambda: "synthetic-ci-key"

          path = Path("scripts/g2b_budget_deployment_canary.py")
          spec = importlib.util.spec_from_file_location(
              "g2b_budget_deployment_canary_ci", path
          )
          canary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(canary)
          canary._today_kst = lambda: today

          report = canary.run_canary(
              allow_live=True,
              snapshot_date=stamp,
          )
          cp = budget_pg_store.get_checkpoint(
              "budget", f"{today.year}:{stamp}"
          )
          meta = json.loads(cp["cursor_value"])

          assert report["collector"]["status"] == "RUNNING", report
          assert report["collector"]["complete"] is False, report
          assert report["checkpoint"]["page_no"] == 2, report
          assert report["checkpoint"]["fetched_count"] == 1000, report
          assert report["resume_expected"] is True, report
          assert cp["status"] == "RUNNING", cp
          assert int(cp["page_no"]) == 2, cp
          assert int(cp["fetched_count"]) == 1000, cp
          assert meta["page_size"] == 1000, meta
          assert meta["checkpoint_contract"] == budget_vnext.CHECKPOINT_CONTRACT
          print("G2B_BUDGET_CANARY_PAGE1_OK", meta["generation"])
          PY

          # Process 2: a fresh Python process simulates Cafe24 restart. It runs the
          # normal unified automatic cycle; page 1 must never be fetched again.
          G2B_AUTO_SYNC=1 python - <<'PY'
          import datetime as dt
          import json
          from contextlib import nullcontext
          from zoneinfo import ZoneInfo

          import budget_appropriation_vnext
          import budget_pg_collection
          import budget_pg_store
          import budget_reorganize_vnext
          import budget_storage
          import budget_vnext
          import lofin_vnext_http
          import vnext_clean_app as clean
          import vnext_source_guard

          today = dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          stamp = today.isoformat()
          stamp8 = today.strftime("%Y%m%d")
          scope = f"{today.year}:{stamp}"

          before = budget_pg_store.get_checkpoint("budget", scope)
          before_meta = json.loads(before["cursor_value"])
          assert before["status"] == "RUNNING", before
          assert int(before["page_no"]) == 2, before
          assert int(before["fetched_count"]) == 1000, before

          calls = []
          def synthetic_fetch(year, snapshot, keyword, *, page, size, **kwargs):
              calls.append(int(page))
              assert int(year) == today.year
              assert str(snapshot) == stamp
              assert int(size) == 1000
              assert int(page) == 2, f"resume restarted from wrong page {page}"
              rows = [
                  {
                      "fyr": str(today.year),
                      "exe_ymd": stamp8,
                      "wa_laf_cd": "4100000",
                      "laf_cd": "4111000",
                      "dept_cd": "CI-D1",
                      "dbiz_cd": f"CI-RESUME-{index:04d}",
                      "dbiz_nm": f"CI 예산 사업 {index:04d}",
                      "acnt_dv_cd": "A1",
                      "bdg_cash_amt": "1000",
                      "ep_amt": "100",
                  }
                  for index in range(1000, 1500)
              ]
              return rows, 1500, "INFO-000", ""

          budget_vnext.fetch_budget_page = synthetic_fetch
          budget_vnext.next_historical_snapshot_date = lambda **kwargs: None
          budget_vnext.current_source_request_context = lambda: None
          vnext_source_guard.current_source_request_context = lambda: None
          vnext_source_guard.operational_budget_source_context = (
              lambda **kwargs: nullcontext()
          )
          lofin_vnext_http.get_lofin_key = lambda: "synthetic-ci-key"
          lofin_vnext_http.daily_quota_status = lambda: {
              "limit": 100,
              "used": 0,
              "remaining": 100,
          }
          budget_appropriation_vnext.collect_full_appropriation = (
              lambda *args, **kwargs: {
                  "status": "COMPLETE",
                  "complete": True,
                  "resumed": True,
                  "fetched": 0,
                  "saved": 0,
                  "source_total": 0,
              }
          )

          # Keep the test focused on the source/checkpoint resume contract. Read-model
          # reorganization and retention have dedicated regressions.
          budget_reorganize_vnext.reorganize_existing_budget_raw = (
              lambda **kwargs: {"complete": True}
          )
          budget_storage.purge_history = (
              lambda *args, **kwargs: {
                  "expired_current_records": 0,
                  "backend": "POSTGRESQL",
              }
          )
          clean.get_service_key = lambda default="": ""
          clean._BACKEND_STATE.update(
              initialized=True,
              initializing=False,
              backend_ok=True,
              backend_error="",
              attempts=1,
          )
          clean._RECENT_COLLECTION_STATE.update(
              state="IDLE",
              last_error="",
              last_started_at="",
              last_finished_at="",
              last_status="",
          )
          assert clean.BUDGET_SYNC_MAX_PAGES > 1

          outcomes = clean._run_recent_collection_once()
          after = budget_pg_store.get_checkpoint("budget", scope)
          after_meta = json.loads(after["cursor_value"])

          assert calls == [2], calls
          assert outcomes["budget"]["complete"] is True, outcomes
          assert outcomes["budget"]["resumed"] is True, outcomes
          assert outcomes["budget"]["fetched"] == 1500, outcomes
          assert after["status"] == "COMPLETE", after
          assert int(after["page_no"]) == 3, after
          assert int(after["fetched_count"]) == 1500, after
          assert before_meta["generation"] == after_meta["generation"], (
              before_meta, after_meta
          )
          assert budget_pg_collection.verified_checkpoint(after) is True
          print(
              "G2B_BUDGET_CANARY_AUTO_RESUME_OK",
              before_meta["generation"],
          )
          PY

          # Process 3: another fresh process represents the next scheduled cycle on
          # the same KST day. COMPLETE checkpoint must short-circuit before source I/O.
          G2B_AUTO_SYNC=1 python - <<'PY'
          import datetime as dt
          import json
          from contextlib import nullcontext
          from zoneinfo import ZoneInfo

          import budget_appropriation_vnext
          import budget_pg_collection
          import budget_pg_store
          import budget_reorganize_vnext
          import budget_storage
          import budget_vnext
          import lofin_vnext_http
          import vnext_clean_app as clean
          import vnext_source_guard

          today = dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          stamp = today.isoformat()
          scope = f"{today.year}:{stamp}"
          before = budget_pg_store.get_checkpoint("budget", scope)
          before_meta = json.loads(before["cursor_value"])
          assert before["status"] == "COMPLETE", before

          def forbidden_fetch(*args, **kwargs):
              raise AssertionError(
                  "same-day COMPLETE checkpoint must not call QWGJK source"
              )

          budget_vnext.fetch_budget_page = forbidden_fetch
          budget_vnext.current_source_request_context = lambda: None
          vnext_source_guard.current_source_request_context = lambda: None
          vnext_source_guard.operational_budget_source_context = (
              lambda **kwargs: nullcontext()
          )
          lofin_vnext_http.get_lofin_key = lambda: "synthetic-ci-key"
          lofin_vnext_http.daily_quota_status = lambda: {
              "limit": 100,
              "used": 0,
              "remaining": 100,
          }
          budget_appropriation_vnext.collect_full_appropriation = (
              lambda *args, **kwargs: {
                  "status": "COMPLETE",
                  "complete": True,
                  "resumed": True,
                  "fetched": 0,
                  "saved": 0,
                  "source_total": 0,
              }
          )
          budget_reorganize_vnext.reorganize_existing_budget_raw = (
              lambda **kwargs: {"complete": True}
          )
          budget_storage.purge_history = (
              lambda *args, **kwargs: {
                  "expired_current_records": 0,
                  "backend": "POSTGRESQL",
              }
          )
          clean.get_service_key = lambda default="": ""
          clean._BACKEND_STATE.update(
              initialized=True,
              initializing=False,
              backend_ok=True,
              backend_error="",
              attempts=1,
          )
          clean._RECENT_COLLECTION_STATE.update(
              state="IDLE",
              last_error="",
              last_started_at="",
              last_finished_at="",
              last_status="",
          )

          outcomes = clean._run_recent_collection_once()
          after = budget_pg_store.get_checkpoint("budget", scope)
          after_meta = json.loads(after["cursor_value"])

          assert outcomes["budget"]["complete"] is True, outcomes
          assert outcomes["budget"]["resumed"] is True, outcomes
          assert outcomes["budget"]["fetched"] == 1500, outcomes
          assert after["status"] == "COMPLETE", after
          assert int(after["page_no"]) == int(before["page_no"]), (before, after)
          assert int(after["fetched_count"]) == 1500, after
          assert before_meta["generation"] == after_meta["generation"], (
              before_meta, after_meta
          )
          assert budget_pg_collection.verified_checkpoint(after) is True
          print(
              "G2B_BUDGET_COMPLETE_CHECKPOINT_SOURCE_SKIP_OK",
              before_meta["generation"],
          )
          PY

      - name: Unified HTTP readiness with real PostgreSQL
        env:
          G2B_TEST_MODE: '0'
          G2B_AUTO_SYNC: '0'
          G2B_RUNTIME_ROLE: UNIFIED
          G2B_V41_FRESH_START: '1'
          G2B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/g2b_vnext_test
          G2B_APP_SCHEMA: g2b_app_ci
          G2B_BUDGET_SCHEMA: g2b_budget_ci
        run: |
          set -euo pipefail
          sudo mkdir -p /app/user_data
          sudo chown "$(id -u):$(id -g)" /app/user_data
          rm -f /tmp/g2b-v41-http.log
          python scripts/g2b_deployment_preflight.py >/tmp/g2b-v41-preflight.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/g2b-v41-preflight.json', encoding='utf-8'))
          assert data["source_io_performed"] is False, data
          assert data["runtime_role"] == "UNIFIED", data
          assert data["control_storage_persistent"] is True, data
          assert data["budget_postgres_configured"] is True, data
          assert data["budget_postgres_ready"] is True, data
          assert data["infrastructure_ready"] is True, data
          assert data["collection_keys_ready"] is False, data
          print("G2B_DEPLOYMENT_PREFLIGHT_OK")
          PY

          PORT=8020 python run.py >/tmp/g2b-v41-http.log 2>&1 &
          pid=$!
          trap 'cat /tmp/g2b-v41-http.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8020/live >/tmp/g2b-v41-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .25
          done
          test "$live" = 1

          ready=0
          for i in $(seq 1 80); do
            code=$(curl -sS -o /tmp/g2b-v41-ready.json -w '%{http_code}' http://127.0.0.1:8020/ready || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            sleep .25
          done
          test "$ready" = 1

          curl -fsS http://127.0.0.1:8020/health >/tmp/g2b-v41-health.json
          python - <<'PY'
          import json
          import os
          import psycopg

          ready=json.load(open('/tmp/g2b-v41-ready.json', encoding='utf-8'))
          health=json.load(open('/tmp/g2b-v41-health.json', encoding='utf-8'))
          live=json.load(open('/tmp/g2b-v41-live.json', encoding='utf-8'))

          assert live["status"] == "ok", live
          assert live["process_alive"] is True, live
          assert live["runtime_role"] == "UNIFIED", live
          assert health["status"] == "ok", health
          assert health["process_alive"] is True, health
          assert health["db_persistent"] is True, health
          assert health["budget_postgres_required"] is True, health
          assert health["budget_postgres_configured"] is True, health
          assert health["budget_postgres_ready"] is True, health
          assert health["operational_ready"] is True, health
          assert ready["budget_postgres_required"] is True, ready
          assert ready["budget_postgres_ready"] is True, ready
          assert ready["operational_ready"] is True, ready

          # 4.1 production storage contract: no source-JSON RAW tables in g2b_app,
          # normalized shopping exists, and budget observations contain hashes/meta
          # but no payload JSON column.
          with psycopg.connect(os.environ["G2B_DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """SELECT table_name FROM information_schema.tables
                         WHERE table_schema=%s""",
                      (os.environ["G2B_APP_SCHEMA"],),
                  )
                  app_tables={row[0] for row in cur.fetchall()}
                  assert "raw_records" not in app_tables, app_tables
                  assert "raw_record_revisions" not in app_tables, app_tables
                  assert "shopping_records" in app_tables, app_tables

                  cur.execute(
                      """SELECT column_name FROM information_schema.columns
                         WHERE table_schema=%s AND table_name='budget_source_observations'""",
                      (os.environ["G2B_BUDGET_SCHEMA"],),
                  )
                  observation_columns={row[0] for row in cur.fetchall()}
                  assert "payload" not in observation_columns, observation_columns

                  cur.execute(
                      """SELECT table_name FROM information_schema.tables
                         WHERE table_schema=%s""",
                      (os.environ["G2B_BUDGET_SCHEMA"],),
                  )
                  budget_tables={row[0] for row in cur.fetchall()}
                  assert "budget_project_revisions" in budget_tables, budget_tables
                  assert "budget_projects" in budget_tables, budget_tables

                  cur.execute(
                      """SELECT value FROM g2b_meta.release_bootstrap
                         WHERE key='fresh_start_4_1_0'"""
                  )
                  marker=cur.fetchone()
                  assert marker and marker[0] == "NORMALIZED_NO_RAW_V1", marker

          print("G2B_UNIFIED_HTTP_POSTGRES_READY_OK")
          print("G2B_V41_NO_RAW_STORAGE_CONTRACT_OK")
          PY

      - name: Compile and run all isolated regressions
        run: python scripts/g2b_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-vnext-regression-${{ github.sha }}
          path: verification/
          retention-days: 14
