name: g2b-vnext

on:
  push:
    branches:
      - feature/g2b-vnext-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'vnext_*.py'
      - 'budget_vnext.py'
      - 'shopping_vnext.py'
      - 'bid_vnext.py'
      - 'award_vnext.py'
      - 'award_projection.py'
      - 'contract_vnext.py'
      - 'contract_projection.py'
      - 'g2b_vnext_pipeline.py'
      - 'g2b_vnext_canary.py'
      - 'historical_vnext.py'
      - 'classification_vnext.py'
      - 'tests/test_*vnext.py'
      - 'tests/test_award_projection.py'
      - 'tests/test_contract_projection.py'
      - 'tests/test_g2b_vnext_pipeline.py'
      - 'tests/test_g2b_vnext_canary.py'
      - 'tests/test_historical_vnext.py'
      - 'tests/test_classification_vnext.py'
      - '.github/workflows/g2b-vnext.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G2B_DB_PATH: /tmp/g2b-vnext-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile vNext modules
        run: |
          python -m py_compile \
            vnext_schema.py vnext_store.py budget_vnext.py shopping_vnext.py \
            bid_vnext.py award_vnext.py award_projection.py \
            contract_vnext.py contract_projection.py g2b_vnext_pipeline.py \
            g2b_vnext_canary.py historical_vnext.py classification_vnext.py
      - name: Run vNext contract tests
        run: |
          python -m pytest -q \
            tests/test_budget_vnext.py \
            tests/test_shopping_vnext.py \
            tests/test_bid_vnext.py \
            tests/test_award_vnext.py \
            tests/test_award_projection.py \
            tests/test_contract_vnext.py \
            tests/test_contract_projection.py \
            tests/test_g2b_vnext_pipeline.py \
            tests/test_g2b_vnext_canary.py \
            tests/test_historical_vnext.py \
            tests/test_classification_vnext.py \
            tests/test_store_vnext.py
