name: g2b-vnext
on:
  push:
    branches: [feature/g2b-vnext-foundation]
    paths: ['*.py', 'tests/**', 'scripts/g2b_*.py', '.github/workflows/g2b-vnext*.yml']
  pull_request:
    paths: ['*.py', 'tests/**', 'scripts/g2b_*.py', '.github/workflows/g2b-vnext*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile and run all isolated regressions
        run: python scripts/g2b_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-vnext-regression-${{ github.sha }}
          path: verification/
          retention-days: 14
