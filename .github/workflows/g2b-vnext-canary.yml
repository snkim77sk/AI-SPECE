name: g2b-vnext-canary
# Explicit dispatch only: no automatic source consumption on each code edit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Regression gate before source requests
        run: python scripts/g2b_verify.py
      - name: Generate ephemeral validation provenance key
        shell: bash
        run: |
          key_file="$RUNNER_TEMP/g2b-vnext-provenance.key"
          python -c "import secrets,pathlib; pathlib.Path('$key_file').write_text(secrets.token_hex(32), encoding='utf-8')"
          chmod 600 "$key_file"
          echo "G2B_VNEXT_PROVENANCE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - name: G2B and budget bounded source probes
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LOFIN_API_KEY: ${{ secrets.LOFIN_API_KEY }}
        run: python scripts/g2b_bounded_canary.py --allow-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-budget-bounded-canary-${{ github.sha }}
          path: verification/
          retention-days: 14
