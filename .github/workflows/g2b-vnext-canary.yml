name: g2b-vnext-canary

on:
  push:
    branches:
      - feature/g2b-vnext-foundation
    paths:
      - 'g2b_vnext_canary.py'
      - 'vnext_http.py'
      - 'vnext_paging.py'
      - 'bid_vnext.py'
      - 'award_vnext.py'
      - 'award_projection.py'
      - 'contract_vnext.py'
      - 'contract_projection.py'
      - 'shopping_vnext.py'
      - '.github/workflows/g2b-vnext-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      G2B_DB_PATH: /tmp/g2b-vnext-canary.sqlite3
      G2B_VNEXT_API_DAILY_LIMIT: '100'
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check runtime service key
        id: key
        shell: bash
        run: |
          if [ -z "$G2B_SERVICE_KEY" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'CANARY_BLOCKED: repository Actions secret G2B_SERVICE_KEY is not configured.'
            echo 'No live G2B request will be attempted.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'CANARY_KEY_CHECK_OK'
          fi
      - name: Compile canary and vNext collectors
        run: |
          python -m py_compile \
            vnext_http.py vnext_paging.py g2b_vnext_canary.py bid_vnext.py award_vnext.py award_projection.py \
            contract_vnext.py contract_projection.py shopping_vnext.py
      - name: Write blocked canary report
        if: steps.key.outputs.configured != 'true'
        run: |
          python - <<'PY'
          import json
          report = {
              "status": "BLOCKED",
              "reason": "G2B_SERVICE_KEY_NOT_CONFIGURED",
              "live_request_attempted": False,
              "production_db_touched": False,
          }
          with open("g2b_vnext_canary_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY
      - name: Run one-day one-page live canary
        if: steps.key.outputs.configured == 'true'
        run: python g2b_vnext_canary.py
      - name: Upload sanitized canary report
        uses: actions/upload-artifact@v4
        with:
          name: g2b-vnext-canary-report
          path: g2b_vnext_canary_report.json
          if-no-files-found: error
          retention-days: 7
