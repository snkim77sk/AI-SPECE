name: g2b-4.1.204-cafe24-deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe24-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify manifest matches 4.1.204 requirements
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tomllib
          root=pathlib.Path('.')
          data=tomllib.loads((root/'pyproject.toml').read_text(encoding='utf-8'))
          req=[
              line.strip()
              for line in (root/'requirements.txt').read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          assert data['project']['version']=='4.1.204', data
          assert sorted(data['project']['dependencies'])==sorted(req), (data['project']['dependencies'], req)
          assert data['tool']['uv']['package'] is False, data
          assert (root/'VERSION.txt').read_text(encoding='utf-8').strip()=='SINSUNG G2B VNEXT 4.1.204'
          print('G2B_4_1_204_MANIFEST_OK')
          PY
      - name: Cafe24-style uv sync
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --directory . --no-dev
          .venv/bin/python - <<'PY'
          import fastapi, uvicorn, sqlalchemy, psycopg
          import main
          assert main.app is not None
          import memory_guard
          state=memory_guard.snapshot(collect=True)
          assert state['guard_ok'] is True, state
          print('G2B_4_1_204_UV_IMPORT_OK', state)
          PY
      - name: Bind existing 4.1.204 run.py
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: RESULT_SERVER
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
        run: |
          set -euo pipefail
          PORT=8000 .venv/bin/python run.py >/tmp/g2b-141-cafe24.log 2>&1 &
          pid=$!
          trap 'cat /tmp/g2b-141-cafe24.log; kill $pid 2>/dev/null || true' EXIT

          # 4.1.204 invariant: the external HTTP port must answer quickly even
          # while the full application import/backend warmup continues.
          live=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/live >/tmp/g2b-141-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          kill -0 "$pid"
          .venv/bin/python - <<'PY'
          import json
          first=json.load(open('/tmp/g2b-141-live.json',encoding='utf-8'))
          assert first['status']=='ok', first
          assert first['process_alive'] is True, first
          assert first['version']=='4.1.204', first
          assert first['runtime'] in {
              'G2B_VNEXT_BOOTSTRAP_LOADING',
              'G2B_VNEXT_CLEAN',
          }, first
          print('G2B_4_1_204_FAST_PORT_BIND_OK', first['runtime'])
          PY

          sleep 5
          kill -0 "$pid"
          curl -fsS http://127.0.0.1:8000/live >/tmp/g2b-141-live-5s.json
          curl -fsS http://127.0.0.1:8000/health >/tmp/g2b-141-health-5s.json

          .venv/bin/python - <<'PY'
          import json
          live=json.load(open('/tmp/g2b-141-live-5s.json',encoding='utf-8'))
          health=json.load(open('/tmp/g2b-141-health-5s.json',encoding='utf-8'))
          assert live['status']=='ok', live
          assert live['process_alive'] is True, live
          assert live['runtime']=='G2B_VNEXT_CLEAN', live
          assert live['version']=='4.1.204', live
          assert health['status']=='ok', health
          assert health['process_alive'] is True, health
          assert health['memory_guard_ok'] is True, health
          assert float(health['memory_rss_mib']) < float(health['memory_soft_limit_mib']), health
          for key in (
              'memory_guard_state',
              'memory_cgroup_source',
              'memory_cgroup_limit_mib',
              'memory_cgroup_current_mib',
              'memory_cgroup_effective_mib',
              'memory_cgroup_wait_threshold_mib',
              'memory_cgroup_block_threshold_mib',
              'memory_cgroup_oom',
              'memory_cgroup_oom_kill',
          ):
              assert key in health, (key, health)
          if float(health['memory_cgroup_limit_mib'] or 0) > 0:
              assert (
                  float(health['memory_cgroup_current_mib'])
                  < float(health['memory_cgroup_limit_mib'])
              ), health
              assert (
                  float(health['memory_cgroup_wait_threshold_mib'])
                  < float(health['memory_cgroup_limit_mib'])
              ), health
              assert (
                  float(health['memory_cgroup_block_threshold_mib'])
                  < float(health['memory_cgroup_limit_mib'])
              ), health
          assert health['post_boot_maintenance_enabled'] is False, health
          print('G2B_4_1_204_CAFE24_BIND_OK', live)
          print('G2B_4_1_204_MEMORY_BASELINE_OK', {
              'rss_mib': health['memory_rss_mib'],
              'soft_limit_mib': health['memory_soft_limit_mib'],
              'cgroup_limit_mib': health['memory_cgroup_limit_mib'],
              'cgroup_current_mib': health['memory_cgroup_current_mib'],
              'cgroup_effective_mib': health['memory_cgroup_effective_mib'],
              'cgroup_wait_mib': health['memory_cgroup_wait_threshold_mib'],
              'cgroup_block_mib': health['memory_cgroup_block_threshold_mib'],
          })
          PY

      - name: Launcher import failure falls back to stdlib recovery HTTP
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: RESULT_SERVER
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
        run: |
          set -euo pipefail
          rm -rf __pycache__
          mv main.py main.py.off
          PORT=8024 .venv/bin/python run.py >/tmp/g2b-204-launcher-failover.log 2>&1 &
          pid=$!
          trap 'mv main.py.off main.py 2>/dev/null || true; cat /tmp/g2b-204-launcher-failover.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8024/live >/tmp/g2b-204-recovery-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          kill -0 "$pid"

          code=$(curl -sS -o /tmp/g2b-204-recovery-ready.json -w '%{http_code}' http://127.0.0.1:8024/ready || true)
          test "$code" = 503

          .venv/bin/python - <<'PY'
          import json
          live=json.load(open('/tmp/g2b-204-recovery-live.json',encoding='utf-8'))
          ready=json.load(open('/tmp/g2b-204-recovery-ready.json',encoding='utf-8'))
          assert live['status']=='ok', live
          assert live['process_alive'] is True, live
          assert live['runtime']=='G2B_LAUNCHER_RECOVERY', live
          assert live['version']=='4.1.204', live
          assert live['database_touched'] is False, live
          assert live['source_io_performed'] is False, live
          assert ready['status']=='not_ready', ready
          assert ready['operational_ready'] is False, ready
          print('G2B_4_1_204_LAUNCHER_FAILOVER_OK', live['deployment_verdict'])
          PY

          grep -q 'G2B_FULL_RUNTIME_LAUNCH_FAILED' /tmp/g2b-204-launcher-failover.log
          grep -q 'G2B_LAUNCHER_RECOVERY_LISTENING' /tmp/g2b-204-launcher-failover.log

