name: g2b-4.1.141.1-cafe24-deploy

on:
  push:
    branches:
      - recovery/g2b-4.1.141.1-cafe24-deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe24-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify manifest matches 4.1.141.1 requirements
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tomllib
          root=pathlib.Path('.')
          data=tomllib.loads((root/'pyproject.toml').read_text(encoding='utf-8'))
          req=[
              line.strip()
              for line in (root/'requirements.txt').read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          assert data['project']['version']=='4.1.141.1', data
          assert sorted(data['project']['dependencies'])==sorted(req), (data['project']['dependencies'], req)
          assert data['tool']['uv']['package'] is False, data
          assert (root/'VERSION.txt').read_text(encoding='utf-8').strip()=='SINSUNG G2B VNEXT 4.1.141.1'
          print('G2B_4_1_141_1_MANIFEST_OK')
          PY
      - name: Cafe24-style uv sync
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --directory . --no-dev
          .venv/bin/python - <<'PY'
          import fastapi, uvicorn, sqlalchemy, psycopg
          import main
          assert main.app is not None
          import memory_guard
          state=memory_guard.snapshot(collect=True)
          assert state['guard_ok'] is True, state
          print('G2B_4_1_141_1_UV_IMPORT_OK', state)
          PY
      - name: Bind existing 4.1.141.1 run.py
        env:
          G2B_TEST_MODE: '0'
          G2B_RUNTIME_ROLE: RESULT_SERVER
          G2B_AUTO_SYNC: '0'
          G2B_AUTO_SYNC_DISABLE: '1'
        run: |
          set -euo pipefail
          PORT=8000 .venv/bin/python run.py >/tmp/g2b-141-cafe24.log 2>&1 &
          pid=$!
          trap 'cat /tmp/g2b-141-cafe24.log; kill $pid 2>/dev/null || true' EXIT

          live=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8000/live >/tmp/g2b-141-live.json 2>/dev/null; then
              live=1
              break
            fi
            sleep .1
          done
          test "$live" = 1
          kill -0 "$pid"

          sleep 5
          kill -0 "$pid"
          curl -fsS http://127.0.0.1:8000/live >/tmp/g2b-141-live-5s.json

          .venv/bin/python - <<'PY'
          import json
          data=json.load(open('/tmp/g2b-141-live-5s.json',encoding='utf-8'))
          assert data['status']=='ok', data
          assert data['process_alive'] is True, data
          assert data['runtime']=='G2B_VNEXT_CLEAN', data
          assert data['version']=='4.1.141.1', data
          print('G2B_4_1_141_1_CAFE24_BIND_OK', data)
          PY
