name: g2b-vnext-revalidation

on:
  push:
    branches: ['audit/g2b-vnext-revalidation-20260917']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      G2B_DB_PATH: /tmp/g2b-audit.sqlite3
      G2B_AUTO_SYNC: '0'
      G2B_SERVICE_KEY: ''
      LOFIN_API_KEY: ''
      G2B_VNEXT_API_DAILY_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1bad48bd3199e322cef62fc64300e0ea35e71ea1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: revalidation_tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile pinned source and run baseline plus boundary expectations
        run: |
          python - <<'PY'
          import json, os, pathlib, py_compile, shutil, subprocess, sys
          import xml.etree.ElementTree as ET
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'g2b-audit-evidence'
          out.mkdir(exist_ok=True)
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert sha == '1bad48bd3199e322cef62fc64300e0ea35e71ea1'
          harness_sha = subprocess.check_output(['git','-C','revalidation_tools','rev-parse','HEAD'], text=True).strip()
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          python_files = [f for f in files if f.endswith('.py')]
          errors = []
          for f in python_files:
              try:
                  py_compile.compile(f, doraise=True)
              except Exception as exc:
                  errors.append({'file': f, 'error': str(exc)})
          guard = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit_no_network.py'
          guard.write_text('import socket\nimport pytest\n@pytest.fixture(autouse=True)\ndef audit_network_block(monkeypatch):\n    def blocked(*args, **kwargs):\n        raise AssertionError("LIVE_NETWORK_DISABLED_FOR_REVALIDATION")\n    monkeypatch.setattr(socket.socket, "connect", blocked)\n    monkeypatch.setattr(socket, "create_connection", blocked)\n', encoding='utf-8')
          env = dict(os.environ)
          env['PYTHONPATH'] = os.getcwd() + os.pathsep + os.environ['RUNNER_TEMP']
          suites = {}
          targets = [('baseline', 'tests'), ('boundary', 'revalidation_tools/audit/test_boundary_revalidation.py')]
          for label, target in targets:
              env['G2B_DB_PATH'] = str(pathlib.Path(os.environ['RUNNER_TEMP']) / (label+'-isolated.sqlite3'))
              cmd = [sys.executable,'-m','pytest','-q','-p','audit_no_network',target,'--tb=short','--junitxml='+str(out/(label+'.xml'))]
              result = subprocess.run(cmd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=240)
              (out/(label+'.log')).write_text(result.stdout, encoding='utf-8')
              suites[label] = {'exit_code': result.returncode}
              xml = out/(label+'.xml')
              if xml.exists():
                  nodes = ET.parse(xml).getroot().findall('.//testsuite')
                  suites[label].update({k: sum(int(n.attrib.get(k, 0)) for n in nodes) for k in ('tests','failures','errors','skipped')})
                  suites[label]['passed'] = suites[label]['tests']-suites[label]['failures']-suites[label]['errors']-suites[label]['skipped']
              print('SUITE', label, json.dumps(suites[label]))
              print(result.stdout[-16000:])
          shutil.copyfile('revalidation_tools/audit/test_boundary_revalidation.py', out/'test_boundary_revalidation.py')
          shutil.copyfile(guard, out/'audit_no_network.py')
          summary = {'source_sha': sha, 'harness_sha': harness_sha, 'python_version': sys.version, 'compiled_files': len(python_files), 'compile_errors': errors, 'suites': suites, 'test_files': [f for f in files if f.startswith('tests/') and f.endswith('.py')], 'live_network_disabled': True, 'production_code_modified': False}
          (out/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'source_snapshot.zip'),'HEAD','*.py','.github/workflows','requirements.txt'], check=True)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Upload evidence even when expectations fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-revalidation-pinned-1bad48bd
          path: ${{ runner.temp }}/g2b-audit-evidence/
          retention-days: 7
      - name: Preserve truthful failure status
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'g2b-audit-evidence'/'summary.json'
          result = json.loads(p.read_text())
          sys.exit(1 if result['compile_errors'] or any(s['exit_code'] for s in result['suites'].values()) else 0)
          PY
