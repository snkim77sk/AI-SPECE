name: g2b-budget-integrity-verified
on:
  push:
    branches: [audit/g2b-budget-integrity-runner-20260917]
    paths: ['repair_bundle/**', '.github/workflows/g2b-budget-integrity-verified.yml']
permissions:
  contents: write
concurrency:
  group: g2b-budget-integrity-isolated-publication
  cancel-in-progress: false
jobs:
  verified-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify patch digest and fixed source pin
        run: python repair_bundle/apply_and_publish.py prepare
      - name: Install isolated regression dependencies
        run: python -m pip install -r "$RUNNER_TEMP/g2b-verified-source/requirements.txt" pytest
      - name: Compile all Python and run every regression
        run: |
          cd "$RUNNER_TEMP/g2b-verified-source"
          python scripts/g2b_verify.py
      - name: Bounded source probes on disposable database
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LOFIN_API_KEY: ${{ secrets.LOFIN_API_KEY }}
        run: |
          cd "$RUNNER_TEMP/g2b-verified-source"
          python scripts/g2b_bounded_canary.py --allow-live
      - name: Publish isolated candidate only after regression gate
        run: python repair_bundle/apply_and_publish.py publish
      - name: Upload source, diffs, JUnit and sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-budget-integrity-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/g2b-verified-source/verification/
          if-no-files-found: error
          retention-days: 14
