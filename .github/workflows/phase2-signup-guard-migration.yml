name: phase2-signup-guard-migration

on:
  push:
    branches:
      - refactor/phase2-2026-08-17
    paths:
      - scripts/phase2_signup_guard_update.py
      - .github/workflows/phase2-signup-guard-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase2-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded signup smoke update
        run: python scripts/phase2_signup_guard_update.py
      - name: Verify branch-specific guard
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CORE_22_BEHAVIOR_PRESERVED_DURING_PHASE2_OK' .github/workflows/signup-approval-smoke.yml
          grep -q 'CORE_22_UNCHANGED_OK' .github/workflows/signup-approval-smoke.yml
      - name: Commit guard update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/signup-approval-smoke.yml
          git diff --cached --quiet && { echo 'No guard changes'; exit 1; }
          git commit -m 'Keep signup smoke strict during Phase 2 version refactor'
          git push origin HEAD:refactor/phase2-2026-08-17
